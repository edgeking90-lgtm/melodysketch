<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Melody Sketch</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #fff; color: #111;
  height: 100%; height: 100dvh;
  overflow: hidden; display: flex; flex-direction: column;
}

/* TOP BAR */
#topbar {
  height: 52px; background: #fff;
  border-bottom: 1px solid #e0e0e0;
  display: flex; align-items: center;
  padding: 0 10px; gap: 6px; flex-shrink: 0;
}
.logo {
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  color: #111; white-space: nowrap; flex-shrink: 0;
}
.logo svg { width:18px; height:18px; flex-shrink:0; }
#projectTitle {
  flex: 1; min-width: 0;
  text-align: center; font-size: 13px;
  color: #888; border: none; background: transparent; outline: none;
}
.topbar-actions { display: flex; gap: 2px; flex-shrink: 0; }
.tb-btn {
  width: 36px; height: 36px;
  border: none; background: transparent;
  border-radius: 8px; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  color: #555; transition: background .12s;
}
.tb-btn:hover, .tb-btn:active { background: #f0f0f0; }
.tb-btn.play { background: #111; color: #fff; border-radius: 50%; font-size: 13px; }
.tb-btn.play:hover { background: #333; }

/* 모바일에서 로고 텍스트 숨기기 */
@media (max-width: 640px) {
  .logo-text { display: none; }
  #projectTitle { display: none; }
}

/* LAYOUT */
#main { flex: 1; display: flex; overflow: hidden; }

/* MODE BAR — 항상 표시 */
#modebar {
  display: flex; gap: 6px;
  padding: 8px 10px; flex-shrink: 0;
  background: #fff; border-bottom: 1px solid #e0e0e0;
}
.mode-btn {
  flex: 1; padding: 8px 0;
  border: 1.5px solid #e0e0e0;
  border-radius: 8px; background: #fff;
  font-size: 13px; font-weight: 700;
  cursor: pointer; text-align: center;
  transition: all .12s; color: #888;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.mode-btn.active-marking {
  background: #111; color: #fff; border-color: #111;
}
.mode-btn.active-lining {
  background: #4a9eff; color: #fff; border-color: #4a9eff;
}
.mode-btn.active-connect {
  background: #f5a623; color: #fff; border-color: #f5a623;
}
/* CONNECT 상태 점 강조 */
.mark-selectable { cursor: pointer; }

/* SIDEBAR (PC) */
#sidebar {
  width: 172px; background: #fff;
  border-right: 1px solid #e0e0e0;
  padding: 14px 10px;
  display: flex; flex-direction: column; gap: 18px;
  flex-shrink: 0; overflow-y: auto;
}
.sb-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: .08em; color: #aaa;
  text-transform: uppercase; display: block; margin-bottom: 6px;
}
.inst-btn {
  width: 100%; padding: 9px 10px;
  border: 1.5px solid #e0e0e0; border-radius: 8px; background: #fff;
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 5px; transition: all .12s; color: #333;
}
.inst-btn:hover { border-color: #bbb; }
.inst-btn.active { background: #111; color: #fff; border-color: #111; }
.inst-btn .icon { font-size: 15px; }

.oct-select {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid #e0e0e0; border-radius: 8px;
  font-size: 13px; background: #fff; outline: none; color: #333; cursor: pointer;
}
.vel-row { display: flex; align-items: center; gap: 8px; }
.vel-row input[type=range] { flex:1; accent-color: #111; cursor: pointer; }
.vel-val { font-size: 12px; color: #666; min-width: 26px; text-align: right; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-label { font-size: 13px; color: #333; }
.toggle {
  width: 36px; height: 20px; background: #ddd; border-radius: 10px;
  position: relative; cursor: pointer; border: none; outline: none; transition: background .18s;
}
.toggle.on { background: #111; }
.toggle::after {
  content: ''; width: 14px; height: 14px; background: #fff; border-radius: 50%;
  position: absolute; top: 3px; left: 3px; transition: left .18s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after { left: 19px; }

.clear-btn {
  width: 100%; padding: 8px; border: 1.5px solid #e0e0e0;
  border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer;
  color: #666; display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all .12s;
}
.clear-btn:hover { border-color: #f55; color: #f55; }

/* MOBILE INSTRUMENT TABS */
#inst-tabs {
  display: none; padding: 8px 10px; gap: 6px;
  flex-shrink: 0; background: #fff;
}
.inst-tab {
  flex: 1; padding: 9px 0;
  border: 1.5px solid #e0e0e0; border-radius: 8px; background: #fff;
  font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
  transition: all .12s; color: #555;
}
.inst-tab.active { background: #111; color: #fff; border-color: #111; }

/* CANVAS AREA */
#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #fff; }
#y-labels {
  position: absolute; left: 0; top: 0; bottom: 0; width: 34px;
  display: flex; flex-direction: column; pointer-events: none; z-index: 2;
}
.y-lbl {
  flex: 1; display: flex; align-items: center; justify-content: flex-end;
  padding-right: 4px; font-size: 9px; color: #ccc; font-weight: 600; user-select: none;
}
.y-lbl.c-note { color: #bbb; }
.y-lbl.c4-note { color: #4a9eff; }

canvas {
  display: block; position: absolute;
  left: 34px; top: 0; right: 0; bottom: 0;
  width: calc(100% - 34px); height: 100%;
  touch-action: none;
}
#c4-line {
  position: absolute; left: 34px; right: 0;
  border-top: 1.5px dashed #4a9eff;
  pointer-events: none; z-index: 3;
}

#hint {
  position: absolute; left: 34px; right: 0; top: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none; gap: 8px; z-index: 1;
}
#hint svg { opacity: .12; width: 56px; height: 56px; }
#hint .h1 { color: #bbb; font-size: 14px; }
#hint .h2 { color: #ddd; font-size: 12px; }

/* MODE INDICATOR on canvas */
#mode-indicator {
  position: absolute; top: 10px; left: 42px;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  pointer-events: none; z-index: 5;
  transition: all .2s;
}
#mode-indicator.marking {
  background: #111; color: #fff;
}
#mode-indicator.lining {
  background: #4a9eff; color: #fff;
}

#note-flash {
  position: absolute; bottom: 68px; left: 50%;
  transform: translateX(-50%);
  background: #111; color: #fff;
  font-size: 13px; font-weight: 700;
  padding: 5px 16px; border-radius: 20px;
  opacity: 0; transition: opacity .15s;
  pointer-events: none; z-index: 10; white-space: nowrap;
}
#note-flash.show { opacity: 1; }

/* BOTTOM BAR (Mobile) */
#bottombar {
  display: none; height: 54px; background: #fff;
  border-top: 1px solid #e0e0e0;
  align-items: center; justify-content: space-around;
  padding: 0 8px; flex-shrink: 0;
}
.bb-btn {
  width: 44px; height: 44px; border: none; background: transparent;
  border-radius: 10px; cursor: pointer; font-size: 18px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; color: #555;
}
.bb-btn span { font-size: 9px; color: #aaa; }
.bb-btn:active { background: #f5f5f5; }

/* MENU */
#menu-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.3); z-index: 100;
}
#menu-overlay.open { display: block; }
#menu-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 230px;
  background: #fff; padding: 16px;
  box-shadow: -4px 0 20px rgba(0,0,0,.1);
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
}
#menu-drawer h3 {
  font-size: 14px; font-weight: 700; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
#menu-drawer h3 button {
  border: none; background: none; font-size: 18px; cursor: pointer; color: #aaa;
}
.m-section {
  padding: 10px 6px 3px; font-size: 10px; font-weight: 700;
  color: #aaa; text-transform: uppercase; letter-spacing: .06em;
}
.m-item {
  padding: 10px 8px; font-size: 13px; color: #333;
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
}
.m-item:active { background: #f5f5f5; }
.m-icon { font-size: 15px; width: 20px; text-align: center; }
.m-vel { padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
.m-vel .lbl {
  font-size: 11px; font-weight: 700; color: #aaa;
  text-transform: uppercase; letter-spacing: .06em;
  display: flex; justify-content: space-between;
}
.m-vel .lbl span { color: #333; }
.m-vel input[type=range] { width: 100%; accent-color: #111; }

/* RESPONSIVE */
@media (max-width: 640px) {
  #sidebar { display: none; }
  #inst-tabs { display: flex; }
  #bottombar { display: flex; }
  #note-flash { bottom: 62px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 14 Q6 5 10 10 Q14 15 18 3"/>
    </svg>
    <span class="logo-text">Melody Sketch</span>
  </div>
  <input id="projectTitle" value="Untitled" placeholder="제목">
  <div class="topbar-actions">
    <button class="tb-btn" id="undoBtn" title="Undo">↩</button>
    <button class="tb-btn" id="redoBtn" title="Redo">↪</button>
    <button class="tb-btn play" id="playBtn">▶</button>
    <button class="tb-btn" id="menuBtn">☰</button>
  </div>
</div>

<!-- MODE BAR -->
<div id="modebar">
  <button class="mode-btn active-marking" id="btn-marking" onclick="setMode('marking')">
    ● MARKING
  </button>
  <button class="mode-btn" id="btn-lining" onclick="setMode('lining')">
    ～ LINING
  </button>
  <button class="mode-btn" id="btn-connect" onclick="setMode('connect')">
    ── CONNECT
  </button>
  <button class="mode-btn" id="btn-smooth" onclick="toggleSmooth()"
          style="display:none; border-color:#4a9eff; color:#4a9eff; font-size:11px;">
    보정 OFF
  </button>
</div>

<!-- MOBILE INSTRUMENT TABS -->
<div id="inst-tabs">
  <button class="inst-tab active" id="mob-piano" onclick="selectInstrument('piano')">🎹 Piano</button>
  <button class="inst-tab" id="mob-violin" onclick="selectInstrument('violin')">🎻 Violin</button>
</div>

<!-- MAIN -->
<div id="main">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div>
      <span class="sb-label">Instrument</span>
      <button class="inst-btn active" id="pc-piano" onclick="selectInstrument('piano')">
        <span class="icon">🎹</span> Piano
      </button>
      <button class="inst-btn" id="pc-violin" onclick="selectInstrument('violin')">
        <span class="icon">🎻</span> Violin
      </button>
    </div>
    <div>
      <span class="sb-label">Mode</span>
      <button class="inst-btn active" id="sb-marking" onclick="setMode('marking')">● Marking</button>
      <button class="inst-btn" id="sb-lining" onclick="setMode('lining')">～ Lining</button>
    </div>
    <div>
      <span class="sb-label">Octave Range</span>
      <select class="oct-select" id="octSelect" onchange="setOctave(this.value)">
        <option value="2">2 Octave</option>
        <option value="3" selected>3 Octave</option>
        <option value="4">4 Octave</option>
        <option value="5">5 Octave</option>
      </select>
    </div>
    <div>
      <span class="sb-label">Velocity</span>
      <div class="vel-row">
        <input type="range" min="1" max="127" value="100" id="velSlider"
               oninput="velocity=+this.value; document.getElementById('velVal').textContent=this.value">
        <span class="vel-val" id="velVal">100</span>
      </div>
    </div>
    <div>
      <span class="sb-label">Grid</span>
      <div class="toggle-row">
        <span class="toggle-label">Show</span>
        <button class="toggle on" id="gridToggle" onclick="toggleGrid()"></button>
      </div>
    </div>
    <div>
      <span class="sb-label">Lining 보정</span>
      <div class="toggle-row">
        <span class="toggle-label">Smoothing</span>
        <button class="toggle" id="smoothToggle" onclick="toggleSmooth()"></button>
      </div>
    </div>
    <div>
      <span class="sb-label">Clear</span>
      <button class="clear-btn" onclick="clearAll()">🗑 Clear All</button>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <div id="y-labels"></div>
    <canvas id="cv"></canvas>
    <div id="c4-line"></div>
    <div id="mode-indicator" class="marking">● MARKING</div>
    <div id="hint">
      <svg viewBox="0 0 56 56" fill="none" stroke="#888" stroke-width="2.5">
        <path d="M6 42 Q16 18 28 28 Q40 38 50 10"/>
        <circle cx="50" cy="10" r="3" fill="#888"/>
      </svg>
      <p class="h1">여기에 점 또는 선을 남기세요</p>
      <p class="h2">MARKING · LINING</p>
    </div>
    <div id="note-flash"></div>
  </div>
</div>

<!-- BOTTOM BAR (mobile) -->
<div id="bottombar">
  <button class="bb-btn" onclick="undo()">↩<span>Undo</span></button>
  <button class="bb-btn" onclick="toggleGrid()">⊞<span>Grid</span></button>
  <button class="bb-btn" onclick="clearAll()">🗑<span>Clear</span></button>
</div>

<!-- MENU -->
<div id="menu-overlay" onclick="closeMenu()">
  <div id="menu-drawer" onclick="event.stopPropagation()">
    <h3>메뉴 <button onclick="closeMenu()">✕</button></h3>
    <div class="m-section">Project</div>
    <div class="m-item"><span class="m-icon">📄</span> 새 프로젝트</div>
    <div class="m-item"><span class="m-icon">💾</span> 저장</div>
    <div class="m-section">Settings</div>
    <div class="m-vel">
      <div class="lbl">Velocity <span id="velValMenu">100</span></div>
      <input type="range" min="1" max="127" value="100"
             oninput="velocity=+this.value;
                      document.getElementById('velValMenu').textContent=this.value;
                      document.getElementById('velVal').textContent=this.value;
                      document.getElementById('velSlider').value=this.value">
    </div>
    <div class="m-item" onclick="toggleGrid(); closeMenu()">
      <span class="m-icon" id="gridIcon">☑</span> 격자 표시
    </div>
    <div class="m-item" onclick="toggleSmooth()">
      <span class="m-icon" id="smoothIcon">☐</span> Lining 보정 (Smoothing)
    </div>
    <div class="m-section">Help</div>
    <div class="m-item"><span class="m-icon">❓</span> 도움말</div>
    <div class="m-section">Test</div>
    <div class="m-item" onclick="loadElise(); closeMenu()">
      <span class="m-icon">🎹</span> 엘리제를 위하여
    </div>
    <div class="m-item" onclick="document.getElementById('audioFileInput').click(); closeMenu()">
      <span class="m-icon">🎵</span> 음원 분석 (테스트)
    </div>
  </div>
</div>

<!-- 숨긴 파일 입력 -->
<input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="analyzeAudio(this)">

<!-- 음원 분석 오버레이 -->
<div id="analysis-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:16px; padding:24px; width:90%; max-width:360px; text-align:center;">
    <div style="font-size:15px; font-weight:700; margin-bottom:8px;">🎵 음원 분석 중...</div>
    <div id="analysis-status" style="font-size:13px; color:#888; margin-bottom:16px;">파일 읽는 중</div>
    <div id="analysis-progress" style="height:4px; background:#eee; border-radius:2px; overflow:hidden;">
      <div id="analysis-bar" style="height:100%; background:#4a9eff; width:0%; transition:width .3s;"></div>
    </div>
    <button onclick="document.getElementById('analysis-overlay').style.display='none'"
            style="margin-top:16px; padding:8px 20px; border:1.5px solid #ddd; border-radius:8px; background:#fff; font-size:13px; cursor:pointer;">
      취소
    </button>
  </div>
</div>

<script>
// ── 88 NOTES ──
const ALL_NOTES = [
  'A0','Bb0','B0',
  'C1','Db1','D1','Eb1','E1','F1','Gb1','G1','Ab1','A1','Bb1','B1',
  'C2','Db2','D2','Eb2','E2','F2','Gb2','G2','Ab2','A2','Bb2','B2',
  'C3','Db3','D3','Eb3','E3','F3','Gb3','G3','Ab3','A3','Bb3','B3',
  'C4','Db4','D4','Eb4','E4','F4','Gb4','G4','Ab4','A4','Bb4','B4',
  'C5','Db5','D5','Eb5','E5','F5','Gb5','G5','Ab5','A5','Bb5','B5',
  'C6','Db6','D6','Eb6','E6','F6','Gb6','G6','Ab6','A6','Bb6','B6',
  'C7','Db7','D7','Eb7','E7','F7','Gb7','G7','Ab7','A7','Bb7','B7',
  'C8'
];

const BASE = 'https://edgeking90-lgtm.github.io/melodysketch/';
const cache = {};

// ── STATE ──
let instrument = 'piano';
let mode = 'marking';
let gridOn = true;
let smoothOn = false;
let velocity = 100;
let octaveRange = 3;
let scrollX = 0;

// ── 시간축 ──
let BPM = 120;
const BEATS_PER_BAR = 4;       // 4/4박자
let pixelsPerBeat = 80;        // 1 beat = 80px
function secondsPerBeat() { return 60 / BPM; }
function xToTime(x) { return (x / pixelsPerBeat) * secondsPerBeat(); } // px → 초
function timeToX(t) { return t * BPM / 60 * pixelsPerBeat; }           // 초 → px

// marks: { x, y, note }  — MARKING 점들
// lines: { points:[{x,y}], notes:[note,...] }  — LINING 선들
let marks = [];
let lines = [];
let connections = []; // { a: markIndex, b: markIndex }
let currentLine = null;
let undoStack = [];
let redoStack = [];
let drawing = false;

// CONNECT 모드 상태
let connectFirst = null; // 첫 번째로 선택된 mark index

// ── NOTES ──
function visibleNotes() {
  const c4 = ALL_NOTES.indexOf('C4');
  const half = Math.round(octaveRange * 6);
  const start = Math.max(0, c4 - half);
  const end   = Math.min(ALL_NOTES.length - 1, c4 + half);
  return ALL_NOTES.slice(start, end + 1).reverse();
}

function noteFromY(y) {
  const notes = visibleNotes();
  const i = Math.floor(y / cv.height * notes.length);
  return notes[Math.min(Math.max(i, 0), notes.length - 1)];
}

function yOfNote(note) {
  const notes = visibleNotes();
  const i = notes.indexOf(note);
  if (i < 0) return null;
  return (i + 0.5) / notes.length * cv.height;
}

// ── CANVAS ──
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  cv.width  = wrap.clientWidth - 34;
  cv.height = wrap.clientHeight;
  buildYLabels();
  updateC4Line();
  drawAll();
}

function buildYLabels() {
  const el = document.getElementById('y-labels');
  el.innerHTML = '';
  visibleNotes().forEach(n => {
    const d = document.createElement('div');
    d.className = 'y-lbl' + (n === 'C4' ? ' c4-note' : n.startsWith('C') ? ' c-note' : '');
    d.textContent = n.startsWith('C') ? n : '';
    el.appendChild(d);
  });
}

function updateC4Line() {
  const y = yOfNote('C4');
  const line = document.getElementById('c4-line');
  if (y !== null) { line.style.top = y + 'px'; line.style.display = 'block'; }
  else line.style.display = 'none';
}

function drawAll() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (gridOn) drawGrid();

  // scrollX 오프셋 적용
  ctx.save();
  ctx.translate(-scrollX, 0);

  // CONNECT 연결선
  connections.forEach(c => {
    const a = marks[c.a];
    const b = marks[c.b];
    if (!a || !b) return;
    ctx.beginPath();
    ctx.strokeStyle = '#f5a623';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 3]);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // LINING 선들
  lines.forEach(l => drawLine(l));
  if (currentLine) drawLine(currentLine);

  // MARKING 점들
  marks.forEach((m, i) => drawMark(m, i));

  ctx.restore();

  // 스크롤 인디케이터 (scrollX > 0 일 때만)
  drawScrollIndicator();
}

function drawScrollIndicator() {
  if (scrollX <= 0) return;
  // 하단 얇은 스크롤바
  const totalW = getTotalWidth();
  const ratio = cv.width / totalW;
  if (ratio >= 1) return;
  const barW = Math.max(40, cv.width * ratio);
  const barX = (scrollX / (totalW - cv.width)) * (cv.width - barW);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.roundRect(barX, cv.height - 6, barW, 4, 2);
  ctx.fill();
}

function getTotalWidth() {
  // 모든 점/선의 최대 X + 여유
  let maxX = cv.width;
  marks.forEach(m => { if (m.x > maxX) maxX = m.x; });
  lines.forEach(l => l.points.forEach(p => { if (p.x > maxX) maxX = p.x; }));
  return maxX + cv.width * 0.5;
}

function drawGrid() {
  const notes = visibleNotes();
  const step = cv.height / notes.length;

  // ── 가로선 (음높이) ──
  notes.forEach((n, i) => {
    ctx.strokeStyle = n.startsWith('C') ? '#e8e8e8' : '#f5f5f5';
    ctx.lineWidth   = n.startsWith('C') ? 1.5 : 1;
    ctx.beginPath();
    ctx.moveTo(0, i * step); ctx.lineTo(cv.width, i * step);
    ctx.stroke();
  });

  // ── 세로선 (시간축: beat / bar 기준) ──
  const beatPx = pixelsPerBeat;
  const barPx  = beatPx * BEATS_PER_BAR;

  // scrollX 기준 시작 beat
  const firstBeat = Math.floor(scrollX / beatPx);
  const lastBeat  = Math.ceil((scrollX + cv.width) / beatPx) + 1;

  for (let b = firstBeat; b <= lastBeat; b++) {
    const screenX = b * beatPx - scrollX;
    const isBar = b % BEATS_PER_BAR === 0;

    if (isBar) {
      // 마디선 — 진하게
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(screenX, 0); ctx.lineTo(screenX, cv.height);
      ctx.stroke();
      // 마디 번호
      const barNum = b / BEATS_PER_BAR + 1;
      ctx.fillStyle = '#ccc';
      ctx.font = '9px sans-serif';
      ctx.fillText(barNum, screenX + 3, 10);
    } else {
      // 박자선 — 연하게
      ctx.strokeStyle = '#f0f0f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(screenX, 0); ctx.lineTo(screenX, cv.height);
      ctx.stroke();
    }
  }
}

// MARKING — 채워진 원
function drawMark(m, idx) {
  const isSelected = (mode === 'connect' && connectFirst === idx);
  ctx.beginPath();
  ctx.arc(m.x, m.y, isSelected ? 9 : 6, 0, Math.PI * 2);
  ctx.fillStyle = isSelected ? '#f5a623' : '#111';
  ctx.fill();
  if (isSelected) {
    // 선택 링
    ctx.beginPath();
    ctx.arc(m.x, m.y, 13, 0, Math.PI * 2);
    ctx.strokeStyle = '#f5a623';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // 음이름 레이블
  ctx.fillStyle = '#555';
  ctx.font = '9px sans-serif';
  ctx.fillText(m.note, m.x + 9, m.y + 3);
}

// 포인트 다운샘플
function downsample(pts, every) {
  if (pts.length <= 4) return pts;
  const result = [pts[0]];
  for (let i = every; i < pts.length - 1; i += every) result.push(pts[i]);
  result.push(pts[pts.length - 1]);
  return result;
}

// Chaikin 알고리즘 — passes 횟수만큼 반복
function chaikin(pts, passes) {
  let p = pts;
  for (let pass = 0; pass < passes; pass++) {
    const next = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      next.push({ x: p[i].x * 0.75 + p[i+1].x * 0.25, y: p[i].y * 0.75 + p[i+1].y * 0.25 });
      next.push({ x: p[i].x * 0.25 + p[i+1].x * 0.75, y: p[i].y * 0.25 + p[i+1].y * 0.75 });
    }
    next.push(p[p.length - 1]);
    p = next;
  }
  return p;
}

// LINING — ●~~~~~~~~~~~~●
function drawLine(l) {
  if (!l.points || l.points.length < 1) return;
  const first = l.points[0];
  const last  = l.points[l.points.length - 1];
  const isActive = (currentLine && l === currentLine);
  // 선을 그릴 당시의 smoothed 플래그 사용 (전역 smoothOn 아님)
  const useSmooth = l.smoothed;

  if (l.points.length >= 2) {
    let pts;
    if (useSmooth) {
      // 강한 보정: 6개마다 다운샘플 + Chaikin 6패스
      const ds = downsample(l.points, 6);
      pts = chaikin(ds, 6);
    } else {
      pts = l.points;
    }

    ctx.beginPath();
    ctx.strokeStyle = '#4a9eff';
    ctx.lineWidth = useSmooth ? 2.5 : 2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (useSmooth && pts.length >= 3) {
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i].x + pts[i+1].x) / 2;
        const my = (pts[i].y + pts[i+1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    } else {
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    }
    ctx.stroke();
  }

  // 시작점 ●
  ctx.beginPath();
  ctx.arc(first.x, first.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#4a9eff';
  ctx.fill();

  // 종료점 ● — 드래그 완료 후에만
  if (!isActive && l.points.length >= 2) {
    ctx.beginPath();
    ctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#4a9eff';
    ctx.fill();
  }
}

// ── AUDIO ──
function getAudio(note) {
  const key = instrument + note;
  if (!cache[key]) {
    cache[key] = new Audio(BASE + instrument + '/' + note + '.mp3');
    cache[key].preload = 'auto';
  }
  return cache[key];
}

// MARKING 음 길이 설정 (초)
const MARK_DURATION = { piano: 0.3, violin: 0.3 };

// LINING 크로스페이드 설정 (ms)
const LINING_FADE_MS = 120;   // 이전 음 페이드아웃 시간
const LINING_OVERLAP_MS = 80; // 다음 음 시작 딜레이 (겹침)

const fadeTimers = {};
let liningPrevNote = null;

// LINING 전용 재생 — 이전 음 크로스페이드 후 다음 음 시작
function liningCrossfade(note) {
  const targetVol = velocity / 127;

  if (liningPrevNote && liningPrevNote !== note) {
    // 이전 음 페이드아웃
    const prevAudio = getAudio(liningPrevNote);
    const key = 'lf_' + liningPrevNote;
    clearInterval(fadeTimers[key]);
    const startVol = prevAudio.volume;
    const steps = 10;
    const interval = LINING_FADE_MS / steps;
    let i = 0;
    fadeTimers[key] = setInterval(() => {
      i++;
      prevAudio.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) {
        clearInterval(fadeTimers[key]);
        prevAudio.pause();
        prevAudio.currentTime = 0;
        prevAudio.volume = targetVol;
      }
    }, interval);
  }

  // 새 음 — 음이 바뀔 때만 살짝 딜레이
  const delay = (liningPrevNote && liningPrevNote !== note) ? LINING_OVERLAP_MS : 0;
  setTimeout(() => {
    try {
      const a = getAudio(note);
      a.currentTime = 0;
      a.volume = targetVol;
      a.play().catch(() => {});
    } catch(e) {}
  }, delay);

  liningPrevNote = note;
}

// LINING 종료 — 마지막 음 천천히 페이드아웃
function stopLining() {
  if (!liningPrevNote) return;
  const a = getAudio(liningPrevNote);
  const key = 'lf_end_' + liningPrevNote;
  clearInterval(fadeTimers[key]);
  const startVol = a.volume;
  const steps = 12;
  const interval = 200 / steps;
  let i = 0;
  fadeTimers[key] = setInterval(() => {
    i++;
    a.volume = Math.max(0, startVol * (1 - i / steps));
    if (i >= steps) {
      clearInterval(fadeTimers[key]);
      a.pause();
      a.currentTime = 0;
      a.volume = velocity / 127;
    }
  }, interval);
  liningPrevNote = null;
}

let flashTimer;
function playNote(note, isMarking) {
  try {
    const a = getAudio(note);
    a.currentTime = 0;
    a.volume = velocity / 127;
    a.play().catch(() => {});

    if (isMarking) {
      const key = 'mk_' + instrument + note;
      clearInterval(fadeTimers[key]);
      const dur = MARK_DURATION[instrument] || 0.3;
      setTimeout(() => {
        const startVol = a.volume;
        let steps = 0;
        const total = 8;
        fadeTimers[key] = setInterval(() => {
          steps++;
          a.volume = Math.max(0, startVol * (1 - steps / total));
          if (steps >= total) {
            clearInterval(fadeTimers[key]);
            a.pause();
            a.currentTime = 0;
            a.volume = velocity / 127;
          }
        }, 20);
      }, dur * 1000);
    }
  } catch(e) {}

  const f = document.getElementById('note-flash');
  f.textContent = note + '  ·  ' + (instrument === 'piano' ? '🎹' : '🎻');
  f.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => f.classList.remove('show'), 600);
}

// ── POINTER ──
let lastNote = null;
let startPos = null;
let hasMoved = false;

function getPos(e) {
  const r = cv.getBoundingClientRect();
  const sx = cv.width / r.width;
  const sy = cv.height / r.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - r.left) * sx + scrollX, // scrollX 보정
    y: (src.clientY - r.top) * sy
  };
}

// ── SCROLL (두루마리) ──
let scrolling = false;
let scrollStartX = 0;
let scrollStartScrollX = 0;
let touchStartX = 0;
let touchCount = 0;

// PC: 마우스 휠 가로 스크롤
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
  scrollX = Math.max(0, scrollX + delta);
  drawAll();
}, { passive: false });

// 터치 이벤트는 아래 통합 핸들러에서 처리

function onStart(e) {
  if (scrolling) return;
  e.preventDefault();

  // CONNECT 모드: 점 선택 처리
  if (mode === 'connect') {
    const pos = getPos(e);
    const hit = findMarkNear(pos.x, pos.y);
    if (hit === null) return;

    if (connectFirst === null) {
      // 첫 번째 점 선택
      connectFirst = hit;
    } else if (connectFirst !== hit) {
      // 두 번째 점 선택 → 연결
      saveUndo();
      connections.push({ a: connectFirst, b: hit });
      connectFirst = null;
      setMode('marking'); // 연결 완료 후 marking 모드로 복귀
    } else {
      // 같은 점 다시 탭 → 선택 해제
      connectFirst = null;
    }
    drawAll();
    return;
  }

  drawing = true;
  hasMoved = false;
  const pos = getPos(e);
  startPos = pos;
  const note = noteFromY(pos.y);
  lastNote = note;

  if (mode === 'lining') {
    currentLine = { points: [{ x: pos.x, y: pos.y }], notes: [note], smoothed: smoothOn };
    liningCrossfade(note);
  }
  // marking: 일단 기다림 (onEnd에서 점 찍음)

  hideHint();
  redoStack = [];
  drawAll();
}

function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const pos = getPos(e);
  hasMoved = true;

  if (mode === 'lining' && currentLine) {
    const note = noteFromY(pos.y);
    currentLine.points.push({ x: pos.x, y: pos.y });
    if (note !== lastNote) {
      lastNote = note;
      currentLine.notes.push(note);
      liningCrossfade(note);
    }
    drawAll();
  }
}

function onEnd(e) {
  if (e) e.preventDefault();
  if (!drawing) return;
  drawing = false;

  saveUndo();

  if (mode === 'marking') {
    // 탭 = 점 하나
    const note = noteFromY(startPos.y);
    marks.push({ x: startPos.x, y: startPos.y, note });
    playNote(note, true); // MARKING: 짧게 재생

  } else if (mode === 'lining') {
    if (currentLine && currentLine.points.length > 1) {
      lines.push(currentLine);
    }
    currentLine = null;
    stopLining(); // 마지막 음 천천히 페이드아웃
  }

  drawAll();
}

cv.addEventListener('mousedown',  onStart);
cv.addEventListener('mousemove',  onMove);
cv.addEventListener('mouseup',    onEnd);
cv.addEventListener('mouseleave', onEnd);

// ── 터치 통합 핸들러 ──
cv.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    // 2손가락: 스크롤 모드
    scrolling = true;
    drawing = false;
    currentLine = null;
    liningPrevNote = null;
    scrollStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    scrollStartScrollX = scrollX;
  } else if (e.touches.length === 1 && !scrolling) {
    // 1손가락: 그리기
    onStart(e);
  }
}, { passive: false });

cv.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (scrolling && e.touches.length === 2) {
    // 2손가락 스크롤
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    scrollX = Math.max(0, scrollStartScrollX + (scrollStartX - midX));
    drawAll();
  } else if (!scrolling && e.touches.length === 1) {
    // 1손가락 그리기
    onMove(e);
  }
}, { passive: false });

cv.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (e.touches.length < 2 && scrolling) {
    scrolling = false;
  } else if (!scrolling) {
    onEnd(e);
  }
}, { passive: false });

// ── CONNECT 헬퍼 ──
// 탭 위치에서 가장 가까운 mark 찾기 (HIT_RADIUS 안에 있을 때)
const HIT_RADIUS = 24;
function findMarkNear(x, y) {
  let best = null, bestDist = HIT_RADIUS;
  marks.forEach((m, i) => {
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

// ── MODE ──
function setMode(m) {
  mode = m;
  connectFirst = null;
  document.getElementById('btn-marking').className = 'mode-btn' + (m === 'marking' ? ' active-marking' : '');
  document.getElementById('btn-lining').className  = 'mode-btn' + (m === 'lining'  ? ' active-lining'  : '');
  document.getElementById('btn-connect').className = 'mode-btn' + (m === 'connect' ? ' active-connect' : '');
  // smooth 버튼 — LINING일 때만 표시
  const sb = document.getElementById('btn-smooth');
  sb.style.display = m === 'lining' ? '' : 'none';
  // sidebar
  const sbM = document.getElementById('sb-marking');
  const sbL = document.getElementById('sb-lining');
  if (sbM) sbM.classList.toggle('active', m === 'marking');
  if (sbL) sbL.classList.toggle('active', m === 'lining');
  // canvas indicator
  const ind = document.getElementById('mode-indicator');
  if (m === 'marking') { ind.className = 'marking'; ind.textContent = '● MARKING'; ind.style.background = ''; }
  else if (m === 'lining') { ind.className = 'lining'; ind.textContent = '～ LINING'; ind.style.background = ''; }
  else { ind.className = 'lining'; ind.textContent = '── CONNECT'; ind.style.background = '#f5a623'; }
  cv.style.cursor = m === 'marking' ? 'crosshair' : m === 'connect' ? 'pointer' : 'cell';
  drawAll();
}

// ── CONTROLS ──
function selectInstrument(inst) {

  ['pc-piano','pc-violin','mob-piano','mob-violin'].forEach(id => {

}

function setOctave(v) {
  octaveRange = parseInt(v);
  buildYLabels(); updateC4Line(); drawAll();
}

function toggleGrid() {
  gridOn = !gridOn;
  document.getElementById('gridToggle').classList.toggle('on', gridOn);
  document.getElementById('gridIcon').textContent = gridOn ? '☑' : '☐';
  drawAll();
}

function toggleSmooth() {
  smoothOn = !smoothOn;
  const st = document.getElementById('smoothToggle');
  if (st) st.classList.toggle('on', smoothOn);
  const si = document.getElementById('smoothIcon');
  if (si) si.textContent = smoothOn ? '☑' : '☐';

  sb.style.background = smoothOn ? '#4a9eff' : '';
  sb.style.color = smoothOn ? '#fff' : '#4a9eff';

}

function saveUndo() {
  undoStack.push({
    marks: marks.map(m => ({...m})),
    lines: lines.map(l => ({ points: [...l.points], notes: [...l.notes], smoothed: l.smoothed })),
    connections: connections.map(c => ({...c}))
  });
}

function clearAll() {
  saveUndo();
  marks = []; lines = []; connections = []; currentLine = null;
  connectFirst = null;
  drawAll(); showHint();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push({
    marks: marks.map(m=>({...m})),
    lines: lines.map(l=>({points:[...l.points],notes:[...l.notes],smoothed:l.smoothed})),
    connections: connections.map(c=>({...c}))
  });
  const s = undoStack.pop();
  marks = s.marks; lines = s.lines; connections = s.connections;
  if (!marks.length && !lines.length) showHint();
  drawAll();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push({
    marks: marks.map(m=>({...m})),
    lines: lines.map(l=>({points:[...l.points],notes:[...l.notes],smoothed:l.smoothed})),
    connections: connections.map(c=>({...c}))
  });
  const s = redoStack.pop();
  marks = s.marks; lines = s.lines; connections = s.connections;
  hideHint(); drawAll();
}

document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;

// PLAY / STOP
let playTimers = [];
let isPlaying = false;

// PLAY 전용 바이올린 monophonic 처리
let playViolinCurrent = null;
const PLAY_VIOLIN_FADE_MS = 80;

function playViolinMono(note) {
  const targetVol = velocity / 127;

  // 이전 바이올린 음 fade out
  if (playViolinCurrent && playViolinCurrent !== note) {
    const prev = getAudio(playViolinCurrent);
    const startVol = prev.volume;
    const steps = 6;
    const interval = PLAY_VIOLIN_FADE_MS / steps;
    let i = 0;
    const t = setInterval(() => {
      i++;
      prev.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) {
        clearInterval(t);
        prev.pause();
        prev.currentTime = 0;
        prev.volume = targetVol;
      }
    }, interval);
  }

  // 새 음 시작
  setTimeout(() => {
    try {
      const a = getAudio(note);
      a.currentTime = 0;
      a.volume = targetVol;
      a.play().catch(() => {});
    } catch(e) {}
  }, playViolinCurrent && playViolinCurrent !== note ? PLAY_VIOLIN_FADE_MS / 2 : 0);

  playViolinCurrent = note;
}

function stopPlayViolin() {
  if (!playViolinCurrent) return;
  const a = getAudio(playViolinCurrent);
  const startVol = a.volume;
  const steps = 10;
  let i = 0;
  const t = setInterval(() => {
    i++;
    a.volume = Math.max(0, startVol * (1 - i / steps));
    if (i >= steps) {
      clearInterval(t);
      a.pause();
      a.currentTime = 0;
      a.volume = velocity / 127;
    }
  }, 20);
  playViolinCurrent = null;
}

function startPlay() {
  const events = [];

  marks.forEach(m => {
    const timeMs = xToTime(m.x) * 1000;
    const durMs  = (m.durationBeats || 0.5) * secondsPerBeat() * 1000;
    events.push({ timeMs, note: m.note, durMs });
  });

  lines.forEach(l => {
    if (!l.notes || !l.points) return;
    let prevNote = null;
    let noteStartX = l.points[0]?.x || 0;
    l.points.forEach((p, i) => {
      const note = l.notes[i] || l.notes[l.notes.length - 1];
      if (note !== prevNote) {
        if (prevNote !== null) {
          const durMs = xToTime(p.x - noteStartX) * 1000;
          events.push({ timeMs: xToTime(noteStartX) * 1000, note: prevNote, durMs });
        }
        prevNote = note;
        noteStartX = p.x;
      }
    });
    if (prevNote) {
      const lastX = l.points[l.points.length - 1]?.x || noteStartX;
      const durMs = Math.max(200, xToTime(lastX - noteStartX) * 1000);
      events.push({ timeMs: xToTime(noteStartX) * 1000, note: prevNote, durMs });
    }
  });

  if (!events.length) return;

  events.sort((a, b) => a.timeMs - b.timeMs);

  isPlaying = true;
  playViolinCurrent = null;
  document.getElementById('playBtn').textContent = '■';
  document.getElementById('playBtn').title = 'Stop';

  playTimers = events.map((ev, i) => {
    const t = setTimeout(() => {
      if (instrument === 'violin') {
        playViolinMono(ev.note); // 바이올린: monophonic
      } else {
        playNote(ev.note);       // 피아노: 기존 방식
      }
      if (i === events.length - 1) stopPlay();
    }, ev.timeMs);
    return t;
  });
}

function stopPlay() {
  playTimers.forEach(t => clearTimeout(t));
  playTimers = [];
  isPlaying = false;
  // 바이올린 monophonic 정리
  if (instrument === 'violin') stopPlayViolin();
  // 모든 오디오 즉시 정지
  Object.values(cache).forEach(a => {
    try { a.pause(); a.currentTime = 0; } catch(e) {}
  });
  liningPrevNote = null;
  playViolinCurrent = null;
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('playBtn').title = 'Play';
}

document.getElementById('playBtn').onclick = () => {
  if (isPlaying) stopPlay();
  else startPlay();
};

document.getElementById('menuBtn').onclick = openMenu;
function openMenu()  { document.getElementById('menu-overlay').classList.add('open'); }
function closeMenu() { document.getElementById('menu-overlay').classList.remove('open'); }
function hideHint()  { document.getElementById('hint').style.display = 'none'; }
function showHint()  { document.getElementById('hint').style.display = 'flex'; }

// ── 음원 분석 (테스트 모드) ──
function analyzeAudio(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const overlay = document.getElementById('analysis-overlay');
  const status  = document.getElementById('analysis-status');
  const bar     = document.getElementById('analysis-bar');
  overlay.style.display = 'flex';
  status.textContent = '파일 읽는 중...';
  bar.style.width = '10%';

  const reader = new FileReader();
  reader.onload = (e) => {
    status.textContent = '오디오 디코딩 중...';
    bar.style.width = '30%';

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();

    actx.decodeAudioData(e.target.result, (buffer) => {
      status.textContent = '주파수 분석 중...';
      bar.style.width = '60%';

      const rawData = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;
      const duration = buffer.duration;

      // 캔버스 가로를 두루마리 기준으로 매핑
      // 1초 = 80px 기준으로 확장
      const PX_PER_SEC = 80;
      const totalWidth = Math.max(cv.width, duration * PX_PER_SEC);

      // 분석 구간: 0.1초마다 피치 추출
      const interval = 0.1;
      const samplesPerChunk = Math.floor(sampleRate * interval);
      const chunks = Math.floor(rawData.length / samplesPerChunk);

      // 파형 + 피치 데이터 수집
      const wavePoints = [];
      const pitchMarks = [];
      const notes = visibleNotes();

      for (let c = 0; c < chunks; c++) {
        const start = c * samplesPerChunk;
        const chunk = rawData.slice(start, start + samplesPerChunk);

        // RMS (파형 진폭)
        let rms = 0;
        for (let s = 0; s < chunk.length; s++) rms += chunk[s] * chunk[s];
        rms = Math.sqrt(rms / chunk.length);

        // 자기상관으로 기본 주파수 추정
        const freq = autocorrelate(chunk, sampleRate);
        const x = (c / chunks) * totalWidth;

        wavePoints.push({ x, rms });

        if (freq > 27 && freq < 4200 && rms > 0.005) {
          const note = freqToNote(freq);
          const y = yOfNote(note);
          if (y !== null) pitchMarks.push({ x, y, note, rms });
        }
      }

      bar.style.width = '90%';
      status.textContent = '캔버스에 표시 중...';

      setTimeout(() => {
        // 기존 내용 유지하고 분석 결과 추가
        saveUndo();
        hideHint();

        // LINING: 피치 흐름을 선으로
        if (pitchMarks.length >= 2) {
          // 인접한 점들을 묶어서 선으로
          let seg = { points: [{ x: pitchMarks[0].x, y: pitchMarks[0].y }], notes: [pitchMarks[0].note], smoothed: true };
          for (let i = 1; i < pitchMarks.length; i++) {
            const gap = pitchMarks[i].x - pitchMarks[i-1].x;
            if (gap < PX_PER_SEC * 0.6) {
              seg.points.push({ x: pitchMarks[i].x, y: pitchMarks[i].y });
              seg.notes.push(pitchMarks[i].note);
            } else {
              if (seg.points.length >= 2) lines.push(seg);
              seg = { points: [{ x: pitchMarks[i].x, y: pitchMarks[i].y }], notes: [pitchMarks[i].note], smoothed: true };
            }
          }
          if (seg.points.length >= 2) lines.push(seg);
        }

        // MARKING: 강한 음들만 점으로
        pitchMarks
          .filter((p, i) => i % 3 === 0 && p.rms > 0.01)
          .forEach(p => marks.push({ x: p.x, y: p.y, note: p.note }));

        drawAll();
        bar.style.width = '100%';
        status.textContent = '완료!';
        setTimeout(() => { overlay.style.display = 'none'; }, 800);
        actx.close();
      }, 100);

    }, () => {
      status.textContent = '디코딩 실패. 다른 파일을 시도해보세요.';
      bar.style.width = '0%';
    });
  };
  reader.readAsArrayBuffer(file);
}

// 자기상관 기반 피치 추정
function autocorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  // 피아노 최저음 A0=27.5Hz, 최고음 C8=4186Hz
  // offset 범위: sampleRate/4186 ~ sampleRate/27.5
  const minOffset = Math.floor(sampleRate / 4200);
  const maxOffset = Math.min(Math.floor(SIZE / 2), Math.floor(sampleRate / 27));
  const MAX_SAMPLES = Math.floor(SIZE / 2);
  let best_offset = -1, best_correlation = 0;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;

  let lastCorrelation = 1;
  for (let offset = minOffset; offset < maxOffset; offset++) {
    let correlation = 0;
    for (let i = 0; i < MAX_SAMPLES; i++) {
      correlation += Math.abs(buf[i] - buf[i + offset]);
    }
    correlation = 1 - correlation / MAX_SAMPLES;
    if (correlation > 0.9 && correlation > lastCorrelation) {
      best_correlation = correlation;
      best_offset = offset;
    }
    if (correlation > best_correlation) {
      best_correlation = correlation;
      best_offset = offset;
    }
    lastCorrelation = correlation;
  }
  if (best_correlation > 0.01 && best_offset > 0) {
    return sampleRate / best_offset;
  }
  return -1;
}

// 주파수 → ALL_NOTES 중 가장 가까운 노트
function freqToNote(freq) {
  const A4 = 440;
  const MIDI_A4 = 69;
  // 주파수 → MIDI 번호
  const midi = Math.round(MIDI_A4 + 12 * Math.log2(freq / A4));
  const noteNames = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const octave = Math.floor(midi / 12) - 1; // MIDI 0 = C-1
  const name = noteNames[((midi % 12) + 12) % 12];
  const candidate = name + octave;
  // ALL_NOTES에 있으면 그대로, 없으면 가장 가까운 것으로
  if (ALL_NOTES.includes(candidate)) return candidate;
  // 범위 클램프
  if (midi < 21) return ALL_NOTES[0];   // A0
  if (midi > 108) return ALL_NOTES[ALL_NOTES.length - 1]; // C8
  return candidate;
}

// ── 엘리제를 위하여 데모 (BPM 기반) ──
function loadElise() {
  saveUndo();
  clearAll();
  hideHint();
  scrollX = 0;

  // pixelsPerBeat 기준 음표 길이 (BPM=120, 1beat=80px)
  const S  = pixelsPerBeat / 2;        // 8분음표  = 40px
  const S3 = pixelsPerBeat * 3 / 4;    // 점8분음표 = 60px
  const Q  = pixelsPerBeat;            // 4분음표  = 80px
  const DQ = pixelsPerBeat * 1.5;      // 점4분음표 = 120px
  const H  = pixelsPerBeat * 2;        // 2분음표  = 160px
  const W  = pixelsPerBeat * 4;        // 온음표   = 320px

  // 엘리제를 위하여 — 멜로디 시퀀스 [note, duration_px]
  // 3/8 박자 기준, BPM 맞춰 조정
  const melody = [
    // 마디 1
    ['E5',S],['Eb5',S],['E5',S],['Eb5',S],['E5',S],['B4',S],['D5',S],['C5',S],
    // 마디 2
    ['A4',DQ],['C4',S],['E4',S],['A4',S],
    // 마디 3
    ['B4',DQ],['E4',S],['Ab4',S],['B4',S],
    // 마디 4
    ['C5',DQ],['E4',S],['E5',S],['Eb5',S],
    // 마디 5 — 테마 반복
    ['E5',S],['Eb5',S],['E5',S],['Eb5',S],['E5',S],['B4',S],['D5',S],['C5',S],
    // 마디 6
    ['A4',DQ],['C4',S],['E4',S],['A4',S],
    // 마디 7
    ['B4',DQ],['E4',S],['C5',S],['B4',S],
    // 마디 8
    ['A4',H],['B4',S],
    // 마디 9 — B섹션
    ['C5',S],['B4',S],['A4',S],['B4',S],['C5',S],['E5',S],
    // 마디 10
    ['A5',DQ],['Ab5',S],['A5',S],
    // 마디 11
    ['E5',S],['F5',S],['E5',S],['Eb5',S],['E5',S],['B4',S],
    // 마디 12
    ['D5',S],['C5',S],['B4',S],['A4',S],
    // 마디 13 — 테마 귀환
    ['E5',S],['Eb5',S],['E5',S],['Eb5',S],['E5',S],['B4',S],['D5',S],['C5',S],
    // 마디 14
    ['A4',DQ],['C4',S],['E4',S],['A4',S],
    // 마디 15
    ['B4',DQ],['E4',S],['Ab4',S],['B4',S],
    // 마디 16
    ['C5',DQ],['E4',S],['E5',S],['Eb5',S],
    // 마디 17 — 코다
    ['E5',S],['Eb5',S],['E5',S],['B4',S],['D5',S],['C5',S],
    // 마디 18
    ['A4',DQ],['C4',S],['E4',S],['A4',S],
    // 마디 19
    ['B4',DQ],['E4',S],['C5',S],['B4',S],
    // 마디 20
    ['A4',H],
  ];

  const startX = pixelsPerBeat; // 1박자 여백
  let x = startX;
  const linePoints = [];
  const lineNotes  = [];

  melody.forEach(([note, dur]) => {
    const y = yOfNote(note);
    if (y !== null) {
      linePoints.push({ x, y });
      lineNotes.push(note);
      // 긴 음표는 수평선으로 뻗음
      if (dur >= Q) {
        linePoints.push({ x: x + dur - 2, y });
        lineNotes.push(note);
      }
    }
    x += dur;
  });

  if (linePoints.length >= 2) {
    lines.push({ points: linePoints, notes: lineNotes, smoothed: false });
  }

  // 4분음표 이상 음은 MARKING 점으로도
  let mx = startX;
  melody.forEach(([note, dur]) => {
    const y = yOfNote(note);
    if (y !== null && dur >= Q) {
      marks.push({ x: mx, y, note, durationBeats: dur / pixelsPerBeat });
    }
    mx += dur;
  });

  drawAll();
}

resize();
setMode('marking');
