<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Melody Sketch</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #fff; color: #111;
  height: 100%; height: 100dvh;
  overflow: hidden; display: flex; flex-direction: column;
}

/* TOP BAR */
#topbar {
  height: 52px; background: #fff;
  border-bottom: 1px solid #e0e0e0;
  display: flex; align-items: center;
  padding: 0 14px; gap: 10px; flex-shrink: 0;
}
.logo {
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  color: #111; white-space: nowrap;
}
.logo svg { width:18px; height:18px; flex-shrink:0; }
#projectTitle {
  flex: 1; text-align: center; font-size: 13px;
  color: #888; border: none; background: transparent; outline: none;
}
.topbar-actions { display: flex; gap: 4px; }
.tb-btn {
  width: 36px; height: 36px;
  border: none; background: transparent;
  border-radius: 8px; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  color: #555; transition: background .12s;
}
.tb-btn:hover, .tb-btn:active { background: #f0f0f0; }
.tb-btn.play { background: #111; color: #fff; border-radius: 50%; font-size: 13px; }
.tb-btn.play:hover { background: #333; }

/* LAYOUT */
#main { flex: 1; display: flex; overflow: hidden; }

/* MODE BAR — 항상 표시 */
#modebar {
  display: flex; gap: 6px;
  padding: 8px 10px; flex-shrink: 0;
  background: #fff; border-bottom: 1px solid #e0e0e0;
}
.mode-btn {
  flex: 1; padding: 8px 0;
  border: 1.5px solid #e0e0e0;
  border-radius: 8px; background: #fff;
  font-size: 13px; font-weight: 700;
  cursor: pointer; text-align: center;
  transition: all .12s; color: #888;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.mode-btn.active-marking {
  background: #111; color: #fff; border-color: #111;
}
.mode-btn.active-lining {
  background: #4a9eff; color: #fff; border-color: #4a9eff;
}

/* SIDEBAR (PC) */
#sidebar {
  width: 172px; background: #fff;
  border-right: 1px solid #e0e0e0;
  padding: 14px 10px;
  display: flex; flex-direction: column; gap: 18px;
  flex-shrink: 0; overflow-y: auto;
}
.sb-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: .08em; color: #aaa;
  text-transform: uppercase; display: block; margin-bottom: 6px;
}
.inst-btn {
  width: 100%; padding: 9px 10px;
  border: 1.5px solid #e0e0e0; border-radius: 8px; background: #fff;
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 5px; transition: all .12s; color: #333;
}
.inst-btn:hover { border-color: #bbb; }
.inst-btn.active { background: #111; color: #fff; border-color: #111; }
.inst-btn .icon { font-size: 15px; }

.oct-select {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid #e0e0e0; border-radius: 8px;
  font-size: 13px; background: #fff; outline: none; color: #333; cursor: pointer;
}
.vel-row { display: flex; align-items: center; gap: 8px; }
.vel-row input[type=range] { flex:1; accent-color: #111; cursor: pointer; }
.vel-val { font-size: 12px; color: #666; min-width: 26px; text-align: right; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-label { font-size: 13px; color: #333; }
.toggle {
  width: 36px; height: 20px; background: #ddd; border-radius: 10px;
  position: relative; cursor: pointer; border: none; outline: none; transition: background .18s;
}
.toggle.on { background: #111; }
.toggle::after {
  content: ''; width: 14px; height: 14px; background: #fff; border-radius: 50%;
  position: absolute; top: 3px; left: 3px; transition: left .18s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after { left: 19px; }

.clear-btn {
  width: 100%; padding: 8px; border: 1.5px solid #e0e0e0;
  border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer;
  color: #666; display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all .12s;
}
.clear-btn:hover { border-color: #f55; color: #f55; }

/* MOBILE INSTRUMENT TABS */
#inst-tabs {
  display: none; padding: 8px 10px; gap: 6px;
  flex-shrink: 0; background: #fff;
}
.inst-tab {
  flex: 1; padding: 9px 0;
  border: 1.5px solid #e0e0e0; border-radius: 8px; background: #fff;
  font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
  transition: all .12s; color: #555;
}
.inst-tab.active { background: #111; color: #fff; border-color: #111; }

/* CANVAS AREA */
#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #fff; }
#y-labels {
  position: absolute; left: 0; top: 0; bottom: 0; width: 34px;
  display: flex; flex-direction: column; pointer-events: none; z-index: 2;
}
.y-lbl {
  flex: 1; display: flex; align-items: center; justify-content: flex-end;
  padding-right: 4px; font-size: 9px; color: #ccc; font-weight: 600; user-select: none;
}
.y-lbl.c-note { color: #bbb; }
.y-lbl.c4-note { color: #4a9eff; }

canvas {
  display: block; position: absolute;
  left: 34px; top: 0; right: 0; bottom: 0;
  width: calc(100% - 34px); height: 100%;
  touch-action: none;
}
#c4-line {
  position: absolute; left: 34px; right: 0;
  border-top: 1.5px dashed #4a9eff;
  pointer-events: none; z-index: 3;
}

#hint {
  position: absolute; left: 34px; right: 0; top: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none; gap: 8px; z-index: 1;
}
#hint svg { opacity: .12; width: 56px; height: 56px; }
#hint .h1 { color: #bbb; font-size: 14px; }
#hint .h2 { color: #ddd; font-size: 12px; }

/* MODE INDICATOR on canvas */
#mode-indicator {
  position: absolute; top: 10px; left: 42px;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  pointer-events: none; z-index: 5;
  transition: all .2s;
}
#mode-indicator.marking {
  background: #111; color: #fff;
}
#mode-indicator.lining {
  background: #4a9eff; color: #fff;
}

#note-flash {
  position: absolute; bottom: 68px; left: 50%;
  transform: translateX(-50%);
  background: #111; color: #fff;
  font-size: 13px; font-weight: 700;
  padding: 5px 16px; border-radius: 20px;
  opacity: 0; transition: opacity .15s;
  pointer-events: none; z-index: 10; white-space: nowrap;
}
#note-flash.show { opacity: 1; }

/* BOTTOM BAR (Mobile) */
#bottombar {
  display: none; height: 54px; background: #fff;
  border-top: 1px solid #e0e0e0;
  align-items: center; justify-content: space-around;
  padding: 0 8px; flex-shrink: 0;
}
.bb-btn {
  width: 44px; height: 44px; border: none; background: transparent;
  border-radius: 10px; cursor: pointer; font-size: 18px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; color: #555;
}
.bb-btn span { font-size: 9px; color: #aaa; }
.bb-btn:active { background: #f5f5f5; }

/* MENU */
#menu-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.3); z-index: 100;
}
#menu-overlay.open { display: block; }
#menu-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 230px;
  background: #fff; padding: 16px;
  box-shadow: -4px 0 20px rgba(0,0,0,.1);
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
}
#menu-drawer h3 {
  font-size: 14px; font-weight: 700; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
#menu-drawer h3 button {
  border: none; background: none; font-size: 18px; cursor: pointer; color: #aaa;
}
.m-section {
  padding: 10px 6px 3px; font-size: 10px; font-weight: 700;
  color: #aaa; text-transform: uppercase; letter-spacing: .06em;
}
.m-item {
  padding: 10px 8px; font-size: 13px; color: #333;
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 9px;
}
.m-item:active { background: #f5f5f5; }
.m-icon { font-size: 15px; width: 20px; text-align: center; }
.m-vel { padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
.m-vel .lbl {
  font-size: 11px; font-weight: 700; color: #aaa;
  text-transform: uppercase; letter-spacing: .06em;
  display: flex; justify-content: space-between;
}
.m-vel .lbl span { color: #333; }
.m-vel input[type=range] { width: 100%; accent-color: #111; }

/* RESPONSIVE */
@media (max-width: 640px) {
  #sidebar { display: none; }
  #inst-tabs { display: flex; }
  #bottombar { display: flex; }
  #note-flash { bottom: 62px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 14 Q6 5 10 10 Q14 15 18 3"/>
    </svg>
    Melody Sketch
  </div>
  <input id="projectTitle" value="Untitled" placeholder="제목">
  <div class="topbar-actions">
    <button class="tb-btn" id="undoBtn" title="Undo">↩</button>
    <button class="tb-btn" id="redoBtn" title="Redo">↪</button>
    <button class="tb-btn play" id="playBtn">▶</button>
    <button class="tb-btn" id="menuBtn">☰</button>
  </div>
</div>

<!-- MODE BAR -->
<div id="modebar">
  <button class="mode-btn active-marking" id="btn-marking" onclick="setMode('marking')">
    ● MARKING
  </button>
  <button class="mode-btn" id="btn-lining" onclick="setMode('lining')">
    ～ LINING
  </button>
</div>

<!-- MOBILE INSTRUMENT TABS -->
<div id="inst-tabs">
  <button class="inst-tab active" id="mob-piano" onclick="selectInstrument('piano')">🎹 Piano</button>
  <button class="inst-tab" id="mob-violin" onclick="selectInstrument('violin')">🎻 Violin</button>
</div>

<!-- MAIN -->
<div id="main">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div>
      <span class="sb-label">Instrument</span>
      <button class="inst-btn active" id="pc-piano" onclick="selectInstrument('piano')">
        <span class="icon">🎹</span> Piano
      </button>
      <button class="inst-btn" id="pc-violin" onclick="selectInstrument('violin')">
        <span class="icon">🎻</span> Violin
      </button>
    </div>
    <div>
      <span class="sb-label">Mode</span>
      <button class="inst-btn active" id="sb-marking" onclick="setMode('marking')">● Marking</button>
      <button class="inst-btn" id="sb-lining" onclick="setMode('lining')">～ Lining</button>
    </div>
    <div>
      <span class="sb-label">Octave Range</span>
      <select class="oct-select" id="octSelect" onchange="setOctave(this.value)">
        <option value="2">2 Octave</option>
        <option value="3" selected>3 Octave</option>
        <option value="4">4 Octave</option>
        <option value="5">5 Octave</option>
      </select>
    </div>
    <div>
      <span class="sb-label">Velocity</span>
      <div class="vel-row">
        <input type="range" min="1" max="127" value="100" id="velSlider"
               oninput="velocity=+this.value; document.getElementById('velVal').textContent=this.value">
        <span class="vel-val" id="velVal">100</span>
      </div>
    </div>
    <div>
      <span class="sb-label">Grid</span>
      <div class="toggle-row">
        <span class="toggle-label">Show</span>
        <button class="toggle on" id="gridToggle" onclick="toggleGrid()"></button>
      </div>
    </div>
    <div>
      <span class="sb-label">Clear</span>
      <button class="clear-btn" onclick="clearAll()">🗑 Clear All</button>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <div id="y-labels"></div>
    <canvas id="cv"></canvas>
    <div id="c4-line"></div>
    <div id="mode-indicator" class="marking">● MARKING</div>
    <div id="hint">
      <svg viewBox="0 0 56 56" fill="none" stroke="#888" stroke-width="2.5">
        <path d="M6 42 Q16 18 28 28 Q40 38 50 10"/>
        <circle cx="50" cy="10" r="3" fill="#888"/>
      </svg>
      <p class="h1">여기에 점 또는 선을 남기세요</p>
      <p class="h2">MARKING · LINING</p>
    </div>
    <div id="note-flash"></div>
  </div>
</div>

<!-- BOTTOM BAR (mobile) -->
<div id="bottombar">
  <button class="bb-btn" onclick="undo()">↩<span>Undo</span></button>
  <button class="bb-btn" onclick="toggleGrid()">⊞<span>Grid</span></button>
  <button class="bb-btn" onclick="clearAll()">🗑<span>Clear</span></button>
</div>

<!-- MENU -->
<div id="menu-overlay" onclick="closeMenu()">
  <div id="menu-drawer" onclick="event.stopPropagation()">
    <h3>메뉴 <button onclick="closeMenu()">✕</button></h3>
    <div class="m-section">Project</div>
    <div class="m-item"><span class="m-icon">📄</span> 새 프로젝트</div>
    <div class="m-item"><span class="m-icon">💾</span> 저장</div>
    <div class="m-section">Settings</div>
    <div class="m-vel">
      <div class="lbl">Velocity <span id="velValMenu">100</span></div>
      <input type="range" min="1" max="127" value="100"
             oninput="velocity=+this.value;
                      document.getElementById('velValMenu').textContent=this.value;
                      document.getElementById('velVal').textContent=this.value;
                      document.getElementById('velSlider').value=this.value">
    </div>
    <div class="m-item" onclick="toggleGrid(); closeMenu()">
      <span class="m-icon" id="gridIcon">☑</span> 격자 표시
    </div>
    <div class="m-section">Help</div>
    <div class="m-item"><span class="m-icon">❓</span> 도움말</div>
  </div>
</div>

<script>
// ── 88 NOTES ──
const ALL_NOTES = [
  'A0','Bb0','B0',
  'C1','Db1','D1','Eb1','E1','F1','Gb1','G1','Ab1','A1','Bb1','B1',
  'C2','Db2','D2','Eb2','E2','F2','Gb2','G2','Ab2','A2','Bb2','B2',
  'C3','Db3','D3','Eb3','E3','F3','Gb3','G3','Ab3','A3','Bb3','B3',
  'C4','Db4','D4','Eb4','E4','F4','Gb4','G4','Ab4','A4','Bb4','B4',
  'C5','Db5','D5','Eb5','E5','F5','Gb5','G5','Ab5','A5','Bb5','B5',
  'C6','Db6','D6','Eb6','E6','F6','Gb6','G6','Ab6','A6','Bb6','B6',
  'C7','Db7','D7','Eb7','E7','F7','Gb7','G7','Ab7','A7','Bb7','B7',
  'C8'
];

const BASE = 'https://edgeking90-lgtm.github.io/melodysketch/';
const cache = {};

// ── STATE ──
let instrument = 'piano';
let mode = 'marking'; // 'marking' | 'lining'
let gridOn = true;
let velocity = 100;
let octaveRange = 3;

// marks: { x, y, note }  — MARKING 점들
// lines: { points:[{x,y}], notes:[note,...] }  — LINING 선들
let marks = [];
let lines = [];
let currentLine = null;
let undoStack = [];
let redoStack = [];
let drawing = false;

// ── NOTES ──
function visibleNotes() {
  const c4 = ALL_NOTES.indexOf('C4');
  const half = Math.round(octaveRange * 6);
  const start = Math.max(0, c4 - half);
  const end   = Math.min(ALL_NOTES.length - 1, c4 + half);
  return ALL_NOTES.slice(start, end + 1).reverse();
}

function noteFromY(y) {
  const notes = visibleNotes();
  const i = Math.floor(y / cv.height * notes.length);
  return notes[Math.min(Math.max(i, 0), notes.length - 1)];
}

function yOfNote(note) {
  const notes = visibleNotes();
  const i = notes.indexOf(note);
  if (i < 0) return null;
  return (i + 0.5) / notes.length * cv.height;
}

// ── CANVAS ──
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  cv.width  = wrap.clientWidth - 34;
  cv.height = wrap.clientHeight;
  buildYLabels();
  updateC4Line();
  drawAll();
}

function buildYLabels() {
  const el = document.getElementById('y-labels');
  el.innerHTML = '';
  visibleNotes().forEach(n => {
    const d = document.createElement('div');
    d.className = 'y-lbl' + (n === 'C4' ? ' c4-note' : n.startsWith('C') ? ' c-note' : '');
    d.textContent = n.startsWith('C') ? n : '';
    el.appendChild(d);
  });
}

function updateC4Line() {
  const y = yOfNote('C4');
  const line = document.getElementById('c4-line');
  if (y !== null) { line.style.top = y + 'px'; line.style.display = 'block'; }
  else line.style.display = 'none';
}

function drawAll() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (gridOn) drawGrid();

  // LINING 선들
  lines.forEach(l => drawLine(l));
  if (currentLine) drawLine(currentLine);

  // MARKING 점들
  marks.forEach(m => drawMark(m));
}

function drawGrid() {
  const notes = visibleNotes();
  const step = cv.height / notes.length;
  notes.forEach((n, i) => {
    ctx.strokeStyle = n.startsWith('C') ? '#e8e8e8' : '#f5f5f5';
    ctx.lineWidth   = n.startsWith('C') ? 1.5 : 1;
    ctx.beginPath();
    ctx.moveTo(0, i * step); ctx.lineTo(cv.width, i * step);
    ctx.stroke();
  });
  const xStep = cv.width / 8;
  ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++) {
    ctx.beginPath(); ctx.moveTo(i * xStep, 0); ctx.lineTo(i * xStep, cv.height); ctx.stroke();
  }
}

// MARKING — 채워진 원
function drawMark(m) {
  ctx.beginPath();
  ctx.arc(m.x, m.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();
  // 음이름 레이블
  ctx.fillStyle = '#555';
  ctx.font = '9px sans-serif';
  ctx.fillText(m.note, m.x + 9, m.y + 3);
}

// LINING — 부드러운 선
function drawLine(l) {
  if (!l.points || l.points.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = '#4a9eff';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  l.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();
  // 시작점 작은 원
  if (l.points.length > 0) {
    ctx.beginPath();
    ctx.arc(l.points[0].x, l.points[0].y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#4a9eff';
    ctx.fill();
  }
}

// ── AUDIO ──
function getAudio(note) {
  const key = instrument + note;
  if (!cache[key]) {
    cache[key] = new Audio(BASE + instrument + '/' + note + '.mp3');
    cache[key].preload = 'auto';
  }
  return cache[key];
}

// MARKING 음 길이 설정 (초)
const MARK_DURATION = { piano: 0.3, violin: 0.3 };

// LINING 크로스페이드 설정 (ms)
const LINING_FADE_MS = 120;   // 이전 음 페이드아웃 시간
const LINING_OVERLAP_MS = 80; // 다음 음 시작 딜레이 (겹침)

const fadeTimers = {};
let liningPrevNote = null;

// LINING 전용 재생 — 이전 음 크로스페이드 후 다음 음 시작
function liningCrossfade(note) {
  const targetVol = velocity / 127;

  if (liningPrevNote && liningPrevNote !== note) {
    // 이전 음 페이드아웃
    const prevAudio = getAudio(liningPrevNote);
    const key = 'lf_' + liningPrevNote;
    clearInterval(fadeTimers[key]);
    const startVol = prevAudio.volume;
    const steps = 10;
    const interval = LINING_FADE_MS / steps;
    let i = 0;
    fadeTimers[key] = setInterval(() => {
      i++;
      prevAudio.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) {
        clearInterval(fadeTimers[key]);
        prevAudio.pause();
        prevAudio.currentTime = 0;
        prevAudio.volume = targetVol;
      }
    }, interval);
  }

  // 새 음 — 음이 바뀔 때만 살짝 딜레이
  const delay = (liningPrevNote && liningPrevNote !== note) ? LINING_OVERLAP_MS : 0;
  setTimeout(() => {
    try {
      const a = getAudio(note);
      a.currentTime = 0;
      a.volume = targetVol;
      a.play().catch(() => {});
    } catch(e) {}
  }, delay);

  liningPrevNote = note;
}

// LINING 종료 — 마지막 음 천천히 페이드아웃
function stopLining() {
  if (!liningPrevNote) return;
  const a = getAudio(liningPrevNote);
  const key = 'lf_end_' + liningPrevNote;
  clearInterval(fadeTimers[key]);
  const startVol = a.volume;
  const steps = 12;
  const interval = 200 / steps;
  let i = 0;
  fadeTimers[key] = setInterval(() => {
    i++;
    a.volume = Math.max(0, startVol * (1 - i / steps));
    if (i >= steps) {
      clearInterval(fadeTimers[key]);
      a.pause();
      a.currentTime = 0;
      a.volume = velocity / 127;
    }
  }, interval);
  liningPrevNote = null;
}

let flashTimer;
function playNote(note, isMarking) {
  try {
    const a = getAudio(note);
    a.currentTime = 0;
    a.volume = velocity / 127;
    a.play().catch(() => {});

    if (isMarking) {
      const key = 'mk_' + instrument + note;
      clearInterval(fadeTimers[key]);
      const dur = MARK_DURATION[instrument] || 0.3;
      setTimeout(() => {
        const startVol = a.volume;
        let steps = 0;
        const total = 8;
        fadeTimers[key] = setInterval(() => {
          steps++;
          a.volume = Math.max(0, startVol * (1 - steps / total));
          if (steps >= total) {
            clearInterval(fadeTimers[key]);
            a.pause();
            a.currentTime = 0;
            a.volume = velocity / 127;
          }
        }, 20);
      }, dur * 1000);
    }
  } catch(e) {}

  const f = document.getElementById('note-flash');
  f.textContent = note + '  ·  ' + (instrument === 'piano' ? '🎹' : '🎻');
  f.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => f.classList.remove('show'), 600);
}

// ── POINTER ──
let lastNote = null;
let startPos = null;
let hasMoved = false;

function getPos(e) {
  const r = cv.getBoundingClientRect();
  const sx = cv.width / r.width;
  const sy = cv.height / r.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
}

function onStart(e) {
  e.preventDefault();
  drawing = true;
  hasMoved = false;
  const pos = getPos(e);
  startPos = pos;
  const note = noteFromY(pos.y);
  lastNote = note;

  if (mode === 'lining') {
    currentLine = { points: [{ x: pos.x, y: pos.y }], notes: [note] };
    liningCrossfade(note);
  }
  // marking: 일단 기다림 (onEnd에서 점 찍음)

  hideHint();
  redoStack = [];
  drawAll();
}

function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const pos = getPos(e);
  hasMoved = true;

  if (mode === 'lining' && currentLine) {
    const note = noteFromY(pos.y);
    currentLine.points.push({ x: pos.x, y: pos.y });
    if (note !== lastNote) {
      lastNote = note;
      currentLine.notes.push(note);
      liningCrossfade(note);
    }
    drawAll();
  }
}

function onEnd(e) {
  if (e) e.preventDefault();
  if (!drawing) return;
  drawing = false;

  saveUndo();

  if (mode === 'marking') {
    // 탭 = 점 하나
    const note = noteFromY(startPos.y);
    marks.push({ x: startPos.x, y: startPos.y, note });
    playNote(note, true); // MARKING: 짧게 재생

  } else if (mode === 'lining') {
    if (currentLine && currentLine.points.length > 1) {
      lines.push(currentLine);
    }
    currentLine = null;
    stopLining(); // 마지막 음 천천히 페이드아웃
  }

  drawAll();
}

cv.addEventListener('mousedown',  onStart);
cv.addEventListener('mousemove',  onMove);
cv.addEventListener('mouseup',    onEnd);
cv.addEventListener('mouseleave', onEnd);
cv.addEventListener('touchstart', onStart, { passive: false });
cv.addEventListener('touchmove',  onMove,  { passive: false });
cv.addEventListener('touchend',   onEnd,   { passive: false });

// ── MODE ──
function setMode(m) {
  mode = m;
  // modebar
  document.getElementById('btn-marking').className = 'mode-btn' + (m === 'marking' ? ' active-marking' : '');
  document.getElementById('btn-lining').className  = 'mode-btn' + (m === 'lining'  ? ' active-lining'  : '');
  // sidebar
  const sbM = document.getElementById('sb-marking');
  const sbL = document.getElementById('sb-lining');
  if (sbM) sbM.classList.toggle('active', m === 'marking');
  if (sbL) sbL.classList.toggle('active', m === 'lining');
  // canvas indicator
  const ind = document.getElementById('mode-indicator');
  ind.className = 'marking' === m ? 'marking' : 'lining';
  ind.textContent = m === 'marking' ? '● MARKING' : '～ LINING';
  // cursor
  cv.style.cursor = m === 'marking' ? 'crosshair' : 'cell';
}

// ── CONTROLS ──
function selectInstrument(inst) {
  instrument = inst;
  ['pc-piano','pc-violin','mob-piano','mob-violin'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active', id.endsWith(inst));
  });
}

function setOctave(v) {
  octaveRange = parseInt(v);
  buildYLabels(); updateC4Line(); drawAll();
}

function toggleGrid() {
  gridOn = !gridOn;
  document.getElementById('gridToggle').classList.toggle('on', gridOn);
  document.getElementById('gridIcon').textContent = gridOn ? '☑' : '☐';
  drawAll();
}

function saveUndo() {
  undoStack.push({
    marks: marks.map(m => ({...m})),
    lines: lines.map(l => ({ points: [...l.points], notes: [...l.notes] }))
  });
}

function clearAll() {
  saveUndo();
  marks = []; lines = []; currentLine = null;
  drawAll(); showHint();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push({ marks: marks.map(m=>({...m})), lines: lines.map(l=>({points:[...l.points],notes:[...l.notes]})) });
  const s = undoStack.pop();
  marks = s.marks; lines = s.lines;
  if (!marks.length && !lines.length) showHint();
  drawAll();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push({ marks: marks.map(m=>({...m})), lines: lines.map(l=>({points:[...l.points],notes:[...l.notes]})) });
  const s = redoStack.pop();
  marks = s.marks; lines = s.lines;
  hideHint(); drawAll();
}

document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;

// PLAY
document.getElementById('playBtn').onclick = () => {
  const seq = [];
  // marks는 x순 정렬
  [...marks].sort((a,b) => a.x - b.x).forEach(m => seq.push(m.note));
  // lines는 등록 순서대로
  lines.forEach(l => l.notes.forEach(n => seq.push(n)));
  seq.forEach((n, i) => setTimeout(() => playNote(n), i * 200));
};

document.getElementById('menuBtn').onclick = openMenu;
function openMenu()  { document.getElementById('menu-overlay').classList.add('open'); }
function closeMenu() { document.getElementById('menu-overlay').classList.remove('open'); }
function hideHint()  { document.getElementById('hint').style.display = 'none'; }
function showHint()  { document.getElementById('hint').style.display = 'flex'; }

// INIT
window.addEventListener('resize', resize);
resize();
setMode('marking');
</script>
