<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Lab — 허밍 셀 실험실</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #06041A; color: #B0A0D0; font-family: 'Segoe UI', sans-serif; font-size: 12px; overflow: hidden; }

/* ── Toolbar ── */
#toolbar { height: 44px; background: #0A0820; border-bottom: 1px solid #1A1640;
  display: flex; align-items: center; gap: 10px; padding: 0 14px; flex-shrink: 0; }
.tb-title { font-size: 13px; font-weight: 600; color: #9070D0; letter-spacing: .06em; white-space: nowrap; }
.tb-sep { width: 1px; height: 22px; background: #1A1640; flex-shrink: 0; }
.tb-lbl { font-size: 10px; color: #504070; letter-spacing: .04em; white-space: nowrap; }
.tb-btn { padding: 4px 10px; background: #181430; border: 1px solid #2A2050; border-radius: 5px; color: #9080C0; font-size: 11px; cursor: pointer; transition: background .12s, border-color .12s; }
.tb-btn:hover { background: #221860; border-color: #5040A0; color: #C0B0F0; }
.tb-input { width: 52px; padding: 3px 6px; background: #0E0C24; border: 1px solid #2A2050; border-radius: 4px; color: #C0B0F0; font-size: 11px; text-align: center; }
.tb-hint { font-size: 10px; color: #302840; margin-left: auto; white-space: nowrap; }

/* ── Layout ── */
#layout { display: flex; height: calc(100vh - 44px); overflow: hidden; }
#pitch-axis-canvas { flex-shrink: 0; background: #080620; border-right: 1px solid #1A1640; cursor: default; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
#main-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }

/* ── Cluster Panel ── */
#cluster-panel { position: absolute; top: 50px; right: 10px; z-index: 50;
  display: none; background: rgba(10,8,26,.94); border: 1px solid #3A2860;
  border-radius: 8px; min-width: 216px; backdrop-filter: blur(6px); overflow: hidden; user-select: none; }
#cluster-panel.show { display: block; }
.cp-hdr { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 5px; border-bottom: 1px solid #2A2050; }
.cp-title { font-size: 10px; color: #A080E0; font-weight: 600; letter-spacing: .05em; }
.cp-close { background: none; border: none; color: #604880; cursor: pointer; font-size: 13px; padding: 0; line-height: 1; }
.cp-close:hover { color: #D08090; }
.cp-body { padding: 7px 10px 9px; display: flex; flex-direction: column; gap: 4px; }
.cp-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.cp-row span { font-size: 9px; color: #5A4880; }
.cp-row strong { font-size: 10px; color: #C0B0E0; text-align: right; }
.cp-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.cp-hint { font-size: 8px; color: #3A3060; margin-top: 5px; border-top: 1px solid #221840; padding-top: 5px; }
.cp-zoom-btn { margin-top: 5px; width: 100%; padding: 5px 0; background: #221650; border: 1px solid #4828A0; border-radius: 5px; color: #B898F0; font-size: 10px; cursor: pointer; transition: background .12s; }
.cp-zoom-btn:hover { background: #322080; }

/* ── Zoom Panel ── */
#zoom-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 200; display: none; background: rgba(8,6,22,.97); border: 1px solid #5030A0;
  border-radius: 10px; overflow: hidden; box-shadow: 0 8px 32px #00000090; }
#zoom-panel.show { display: block; }
.zp-hdr { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #2A1860; background: rgba(20,12,48,.8); }
.zp-title { font-size: 11px; color: #9060E0; font-weight: 600; letter-spacing: .05em; flex: 1; }
.zp-size { font-size: 10px; color: #504080; }
.zp-close { background: none; border: none; color: #504080; cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
.zp-close:hover { color: #E06080; }
#zoom-canvas { display: block; }
.zp-footer { padding: 5px 12px; font-size: 9px; color: #403060; border-top: 1px solid #1A1040; }

/* ── Drop overlay ── */
#drop-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(60,20,120,.75);
  display: none; align-items: center; justify-content: center; font-size: 22px;
  color: #C0A0F0; border: 3px dashed #7040C0; pointer-events: none; }
#drop-overlay.show { display: flex; }

/* ── Empty state ── */
#empty-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center; pointer-events: none; }
#empty-msg .em-icon { font-size: 48px; opacity: .18; }
#empty-msg .em-text { font-size: 13px; color: #3A3060; margin-top: 12px; line-height: 1.7; }

/* ── Toast ── */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(20,12,48,.95); border: 1px solid #4030A0; border-radius: 6px;
  padding: 6px 16px; font-size: 11px; color: #B0A0D0; display: none; z-index: 1000; pointer-events: none; }
</style>
</head>
<body>

<div id="toolbar">
  <span class="tb-title">⊞ Cell Lab</span>
  <div class="tb-sep"></div>
  <label class="tb-lbl">LMH</label>
  <button class="tb-btn" onclick="openFile()">파일 열기</button>
  <input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileSelect(event)">
  <div class="tb-sep"></div>
  <label class="tb-lbl">BPM</label>
  <input class="tb-input" id="bpm-input" type="number" min="20" max="300" value="120" onchange="rebuildGrid()">
  <div class="tb-sep"></div>
  <label class="tb-lbl">ZOOM</label>
  <button class="tb-btn" onclick="zoomBy(1.5)">+</button>
  <button class="tb-btn" onclick="zoomBy(1/1.5)">−</button>
  <button class="tb-btn" onclick="fitView()">FIT</button>
  <span class="tb-hint">클릭=군집 선택 · Shift+클릭=영역 선택 · Alt+드래그=이동 · 휠=줌 · Shift+휠=피치줌</span>
</div>

<div id="layout">
  <canvas id="pitch-axis-canvas"></canvas>
  <div id="canvas-wrap">
    <canvas id="main-canvas"></canvas>
    <div id="empty-msg">
      <div class="em-icon">⊞</div>
      <div class="em-text">LMH JSON 파일을 열거나<br>여기로 드래그하세요</div>
    </div>
    <div id="cluster-panel">
      <div class="cp-hdr">
        <span class="cp-title" id="cp-title">⊞ Cluster 정보</span>
        <button class="cp-close" onclick="clearSelection()">✕</button>
      </div>
      <div class="cp-body" id="cp-body"></div>
    </div>
  </div>
</div>

<div id="zoom-panel">
  <div class="zp-hdr">
    <span class="zp-title">⊡ Cell 확대</span>
    <span class="zp-size" id="zp-size"></span>
    <button class="zp-close" onclick="closeZoom()">✕</button>
  </div>
  <canvas id="zoom-canvas" width="480" height="320"></canvas>
  <div class="zp-footer" id="zp-footer"></div>
</div>

<div id="drop-overlay">LMH JSON 파일을 여기 놓으세요</div>
<div id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let _strokes = [];       // [{pts:[{time,pitch}]}]
let _cells = new Map();  // "col,row" → cell
let _clusters = [];
let _cellT = 500;        // ms per column (1 beat)
let _cellP = 100;        // cents per row (1 semitone)
let _selectedCluster = null;
let _anchor = null;      // {col,row} — first click anchor for region
let _region = null;      // {col0,row0,col1,row1}

/* ═══════════════════════════════
   VIEW
═══════════════════════════════ */
const V = { scrollMs: 0, pitchCent: 0, zoom: 1, pitchZoom: 2 };

/* ═══════════════════════════════
   CANVAS
═══════════════════════════════ */
const mc  = document.getElementById('main-canvas');
const ctx = mc.getContext('2d');
const pac = document.getElementById('pitch-axis-canvas');
const pCtx = pac.getContext('2d');
const AXIS_W = 38;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  mc.width = W; mc.height = H;
  pac.width = AXIS_W; pac.height = H;
  draw();
}
window.addEventListener('resize', resize);

/* ═══════════════════════════════
   COORD HELPERS
═══════════════════════════════ */
function tx(t) { return (t - V.scrollMs) * V.zoom; }
function xt(x) { return V.scrollMs + x / V.zoom; }
function cy(c) { return mc.height / 2 - (c - V.pitchCent) * V.pitchZoom; }
function yc(y) { return V.pitchCent + (mc.height / 2 - y) / V.pitchZoom; }

/* ═══════════════════════════════
   NOTE NAME
═══════════════════════════════ */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function centsToNote(cents) {
  const midi = 69 + cents / 100;
  const n = Math.round(midi);
  const oct = Math.floor(n / 12) - 1;
  return NOTE_NAMES[((n % 12) + 12) % 12] + oct;
}

/* ═══════════════════════════════
   GRID BUILD
═══════════════════════════════ */
function buildCellGrid(strokes, cellT, cellP) {
  const cells = new Map();
  for (const stroke of strokes) {
    const pts = stroke.pts || [];
    for (let i = 0; i < pts.length - 1; i++) {
      const { time: t0, pitch: p0 } = pts[i], { time: t1, pitch: p1 } = pts[i + 1];
      const dt = t1 - t0; if (dt <= 0) continue;
      const n = Math.max(1, Math.round(dt / 8));
      const dwellPer = dt / n;
      for (let j = 0; j <= n; j++) {
        const f = j / n, t = t0 + f * dt, p = p0 + f * (p1 - p0);
        const col = Math.floor(t / cellT), row = Math.floor(p / cellP);
        const key = `${col},${row}`;
        if (!cells.has(key)) cells.set(key, { col, row, dwell: 0, pAcc: 0, pN: 0, dAcc: 0, pVals: [] });
        const c = cells.get(key);
        c.dwell += dwellPer; c.pAcc += p; c.pN++; c.pVals.push(p);
        c.dAcc += Math.atan2(p1 - p0, dt);
      }
    }
  }
  for (const c of cells.values()) {
    c.avgPitch = c.pAcc / c.pN;
    c.avgDir = (c.dAcc / c.pN) * (180 / Math.PI);
    const m = c.avgPitch;
    c.vibration = Math.sqrt(c.pVals.reduce((s, v) => s + (v - m) * (v - m), 0) / c.pVals.length);
    c.confidence = Math.min(1, c.dwell / cellT);
    c.source = 'hum';
    delete c.pAcc; delete c.pN; delete c.dAcc; delete c.pVals;
  }
  return cells;
}

const PAL = ['#FF6070','#60B8FF','#80E860','#FFB840','#C070FF','#40DCC0',
             '#FF9860','#88AAFF','#FF80C0','#40E8A0','#FFC060','#A060FF',
             '#60D8FF','#FF6040','#80FF80','#C0A0FF'];

function detectClusters(cells, cellT, cellP) {
  const visited = new Set(); const clusters = [];
  for (const key of cells.keys()) {
    if (visited.has(key)) continue;
    const cl = { id: clusters.length, color: PAL[clusters.length % PAL.length],
      cellKeys: new Set(), dwell: 0, minT: Infinity, maxT: -Infinity,
      minP: Infinity, maxP: -Infinity, pAcc: 0, pN: 0 };
    const queue = [key];
    while (queue.length) {
      const k = queue.shift();
      if (visited.has(k)) continue;
      visited.add(k); cl.cellKeys.add(k);
      const c = cells.get(k); c.clusterId = cl.id;
      cl.dwell += c.dwell;
      cl.minT = Math.min(cl.minT, c.col * cellT);
      cl.maxT = Math.max(cl.maxT, (c.col + 1) * cellT);
      cl.minP = Math.min(cl.minP, c.row * cellP);
      cl.maxP = Math.max(cl.maxP, (c.row + 1) * cellP);
      cl.pAcc += c.avgPitch; cl.pN++;
      const [col, row] = k.split(',').map(Number);
      for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
        if (!dc && !dr) continue;
        const nk = `${col + dc},${row + dr}`;
        if (cells.has(nk) && !visited.has(nk)) queue.push(nk);
      }
    }
    cl.avgPitch = cl.pAcc / cl.pN;
    delete cl.pAcc; delete cl.pN;
    clusters.push(cl);
  }
  return clusters;
}

function rebuildGrid() {
  if (!_strokes.length) return;
  const bpm = parseFloat(document.getElementById('bpm-input').value) || 120;
  _cellT = Math.round(60000 / bpm);
  _cellP = 100;
  _cells = buildCellGrid(_strokes, _cellT, _cellP);
  _clusters = detectClusters(_cells, _cellT, _cellP);
  _selectedCluster = null; _anchor = null; _region = null;
  hidePanel(); closeZoom();
  draw();
  toast(`⊞ ${_cells.size}셀 · ${_clusters.length}군집 (${bpm} BPM · 셀=${_cellT}ms×${_cellP}¢)`);
}

/* ═══════════════════════════════
   DRAW
═══════════════════════════════ */
function draw() {
  const W = mc.width, H = mc.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#06041A';
  ctx.fillRect(0, 0, W, H);

  if (_cells.size) {
    drawPianoRollGrid();
    drawCells();
    drawLMHTrace();
    if (_region) drawRegionOutline();
  }

  drawPitchAxis();
}

function drawPianoRollGrid() {
  const W = mc.width, H = mc.height;
  const pMin = yc(H), pMax = yc(0);
  const rowMin = Math.floor(pMin / _cellP) - 1;
  const rowMax = Math.ceil(pMax / _cellP) + 1;

  for (let row = rowMin; row <= rowMax; row++) {
    const p = row * _cellP;
    const y = cy(p);
    const name = centsToNote(p);
    const isBlack = ['C#','D#','F#','G#','A#'].some(n => name.startsWith(n));
    const isC = name.startsWith('C') && !name.startsWith('C#');
    if (isBlack) {
      ctx.fillStyle = 'rgba(20,14,40,.45)';
      const rowH = _cellP * V.pitchZoom;
      ctx.fillRect(0, y, W, rowH);
    }
    ctx.strokeStyle = isC ? 'rgba(100,70,180,.4)' : 'rgba(40,30,80,.28)';
    ctx.lineWidth = isC ? 1 : 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const tMin = xt(0), tMax = xt(W);
  const colMin = Math.max(0, Math.floor(tMin / _cellT) - 1);
  const colMax = Math.ceil(tMax / _cellT) + 1;
  ctx.font = '9px sans-serif';
  for (let col = colMin; col <= colMax; col++) {
    const x = tx(col * _cellT);
    if (x < 0 || x > W) continue;
    const isMeasure = col % 4 === 0;
    ctx.strokeStyle = isMeasure ? 'rgba(80,60,150,.45)' : 'rgba(40,30,80,.22)';
    ctx.lineWidth = isMeasure ? 1 : 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    if (isMeasure) {
      ctx.fillStyle = 'rgba(100,80,160,.55)';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`beat ${col}`, x + 3, 3);
    }
  }
}

function drawCells() {
  const W = mc.width, H = mc.height;
  let maxDwell = 0;
  for (const c of _cells.values()) if (c.dwell > maxDwell) maxDwell = c.dwell;
  if (!maxDwell) return;

  ctx.save();
  for (const [key, c] of _cells) {
    const x0 = tx(c.col * _cellT), x1 = tx((c.col + 1) * _cellT);
    const yTop = cy((c.row + 1) * _cellP), yBot = cy(c.row * _cellP);
    if (x1 < 0 || x0 > W || yBot < 0 || yTop > H) continue;

    const alpha = 0.12 + 0.75 * (c.dwell / maxDwell);
    const isSel = _selectedCluster !== null && _clusters[_selectedCluster]?.cellKeys.has(key);

    if (isSel) {
      ctx.fillStyle = `rgba(255,220,60,${Math.min(1, alpha * 1.4)})`;
      ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop);
      ctx.strokeStyle = 'rgba(255,240,100,.9)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x0, yTop, x1 - x0, yBot - yTop);
    } else {
      const clCol = _clusters[c.clusterId ?? 0]?.color || '#8080C0';
      const rv = parseInt(clCol.slice(1,3),16), gv = parseInt(clCol.slice(3,5),16), bv = parseInt(clCol.slice(5,7),16);
      ctx.fillStyle = `rgba(${rv},${gv},${bv},${alpha})`;
      ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop);
    }

    // Note name when cells are large enough
    const cellPxH = Math.abs(yBot - yTop), cellPxW = x1 - x0;
    if (cellPxH > 14 && cellPxW > 22) {
      ctx.fillStyle = isSel ? 'rgba(80,40,0,.8)' : 'rgba(255,255,255,.38)';
      ctx.font = `${Math.min(cellPxH * .44, 11)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(centsToNote(c.avgPitch), (x0 + x1) / 2, (yTop + yBot) / 2);
    }
  }
  ctx.restore();
}

function drawLMHTrace() {
  if (!_strokes.length) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const stroke of _strokes) {
    const pts = stroke.pts || [];
    if (!pts.length) continue;
    ctx.beginPath();
    let started = false;
    for (const pt of pts) {
      const x = tx(pt.time), y = cy(pt.pitch);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawRegionOutline() {
  const r = _region;
  const rx0 = tx(r.col0 * _cellT), rx1 = tx((r.col1 + 1) * _cellT);
  const ry0 = cy((r.row1 + 1) * _cellP), ry1 = cy(r.row0 * _cellP);
  ctx.save();
  ctx.strokeStyle = 'rgba(200,160,255,.9)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(rx0, ry0, rx1 - rx0, ry1 - ry0);
  ctx.setLineDash([]);
  ctx.restore();
}

function drawPitchAxis() {
  const H = pac.height;
  pCtx.clearRect(0, 0, AXIS_W, H);
  pCtx.fillStyle = '#080620';
  pCtx.fillRect(0, 0, AXIS_W, H);

  if (!_cells.size) return;
  const pMin = yc(H), pMax = yc(0);
  const rowMin = Math.floor(pMin / _cellP) - 1;
  const rowMax = Math.ceil(pMax / _cellP) + 1;

  for (let row = rowMin; row <= rowMax; row++) {
    const p = row * _cellP, y = cy(p);
    if (y < -2 || y > H + 2) continue;
    const name = centsToNote(p);
    const isC = name.startsWith('C') && !name.startsWith('C#');
    pCtx.fillStyle = isC ? 'rgba(160,130,220,.95)' : 'rgba(75,60,125,.7)';
    pCtx.font = isC ? 'bold 9px sans-serif' : '8px sans-serif';
    pCtx.textAlign = 'right';
    pCtx.textBaseline = 'middle';
    pCtx.fillText(name, AXIS_W - 3, y);
    pCtx.strokeStyle = isC ? 'rgba(100,70,180,.35)' : 'rgba(40,30,80,.18)';
    pCtx.lineWidth = 0.5;
    pCtx.beginPath(); pCtx.moveTo(AXIS_W - 12, y); pCtx.lineTo(AXIS_W, y); pCtx.stroke();
  }
}

/* ═══════════════════════════════
   PANELS
═══════════════════════════════ */
function showClusterPanel(clIdx) {
  const cl = _clusters[clIdx];
  if (!cl) { hidePanel(); return; }
  document.getElementById('cp-title').textContent = '⊞ Cluster 정보';
  document.getElementById('cp-body').innerHTML = `
    <div class="cp-row"><span>군집</span><strong><span class="cp-swatch" style="background:${cl.color}"></span>#${cl.id + 1}</strong></div>
    <div class="cp-row"><span>셀 수</span><strong>${cl.cellKeys.size}셀</strong></div>
    <div class="cp-row"><span>시간 범위</span><strong>${(cl.minT/1000).toFixed(2)}s – ${(cl.maxT/1000).toFixed(2)}s</strong></div>
    <div class="cp-row"><span>지속 시간</span><strong>${(cl.maxT-cl.minT).toFixed(0)}ms</strong></div>
    <div class="cp-row"><span>체류 누적</span><strong>${cl.dwell.toFixed(0)}ms</strong></div>
    <div class="cp-row"><span>평균 음정</span><strong>${centsToNote(cl.avgPitch)}</strong></div>
    <div class="cp-row"><span>피치 범위</span><strong>${centsToNote(cl.minP)} – ${centsToNote(cl.maxP)}</strong></div>
    <div class="cp-hint">Shift+클릭으로 영역 선택 · ✕로 해제</div>`;
  document.getElementById('cluster-panel').classList.add('show');
}

function showRegionPanel() {
  const r = _region;
  if (!r) { hidePanel(); return; }
  const cols = r.col1 - r.col0 + 1, rows = r.row1 - r.row0 + 1;
  let cellCount = 0, totalDwell = 0;
  for (let c = r.col0; c <= r.col1; c++) for (let rr = r.row0; rr <= r.row1; rr++) {
    const cell = _cells.get(`${c},${rr}`);
    if (cell) { cellCount++; totalDwell += cell.dwell; }
  }
  const tMin = r.col0 * _cellT, tMax = (r.col1 + 1) * _cellT;
  const pMin = r.row0 * _cellP, pMax = (r.row1 + 1) * _cellP;
  document.getElementById('cp-title').textContent = '⊡ 영역 선택';
  document.getElementById('cp-body').innerHTML = `
    <div class="cp-row"><span>선택 영역</span><strong>${cols}×${rows} 셀</strong></div>
    <div class="cp-row"><span>활성 셀</span><strong>${cellCount}개</strong></div>
    <div class="cp-row"><span>시간</span><strong>${(tMin/1000).toFixed(2)}s – ${(tMax/1000).toFixed(2)}s</strong></div>
    <div class="cp-row"><span>피치</span><strong>${centsToNote(pMin)} – ${centsToNote(pMax)}</strong></div>
    <div class="cp-row"><span>체류 합계</span><strong>${totalDwell.toFixed(0)}ms</strong></div>
    <button class="cp-zoom-btn" onclick="openZoom()">⊡ 확대 보기</button>
    <div class="cp-hint">Shift+클릭으로 영역 조정 · 첫 클릭=기준점</div>`;
  document.getElementById('cluster-panel').classList.add('show');
}

function hidePanel() { document.getElementById('cluster-panel').classList.remove('show'); }

function clearSelection() {
  _selectedCluster = null; _anchor = null; _region = null;
  hidePanel(); closeZoom(); draw();
}

/* ═══════════════════════════════
   ZOOM POPUP
═══════════════════════════════ */
function openZoom() {
  if (!_region) return;
  renderZoom();
  document.getElementById('zoom-panel').classList.add('show');
}

function closeZoom() { document.getElementById('zoom-panel').classList.remove('show'); }

function renderZoom() {
  const zc = document.getElementById('zoom-canvas');
  const ctx2 = zc.getContext('2d');
  const W = zc.width, H = zc.height;
  const r = _region;
  if (!r) return;

  const cols = r.col1 - r.col0 + 1, rows = r.row1 - r.row0 + 1;
  const cellW = W / cols, cellH = H / rows;

  document.getElementById('zp-size').textContent =
    `${cols}×${rows} · ${(cols * _cellT / 1000).toFixed(2)}s × ${rows}반음`;

  ctx2.clearRect(0, 0, W, H);
  ctx2.fillStyle = '#06041A';
  ctx2.fillRect(0, 0, W, H);

  // Piano roll bg
  for (let rr = r.row0; rr <= r.row1; rr++) {
    const name = centsToNote(rr * _cellP);
    if (['C#','D#','F#','G#','A#'].some(n => name.startsWith(n))) {
      ctx2.fillStyle = 'rgba(20,14,40,.5)';
      ctx2.fillRect(0, (r.row1 - rr) * cellH, W, cellH);
    }
  }

  let maxDwell = 0;
  for (let c = r.col0; c <= r.col1; c++) for (let rr = r.row0; rr <= r.row1; rr++) {
    const cell = _cells.get(`${c},${rr}`);
    if (cell && cell.dwell > maxDwell) maxDwell = cell.dwell;
  }

  for (let c = r.col0; c <= r.col1; c++) {
    for (let rr = r.row0; rr <= r.row1; rr++) {
      const bx = (c - r.col0) * cellW, by = (r.row1 - rr) * cellH;
      ctx2.strokeStyle = 'rgba(80,60,140,.3)';
      ctx2.lineWidth = .5;
      ctx2.strokeRect(bx + .5, by + .5, cellW - 1, cellH - 1);
      const cell = _cells.get(`${c},${rr}`);
      if (!cell) continue;
      const alpha = 0.15 + 0.75 * (cell.dwell / (maxDwell || 1));
      const clCol = _clusters[cell.clusterId ?? 0]?.color || '#8080C0';
      const rv = parseInt(clCol.slice(1,3),16), gv = parseInt(clCol.slice(3,5),16), bv = parseInt(clCol.slice(5,7),16);
      ctx2.fillStyle = `rgba(${rv},${gv},${bv},${alpha})`;
      ctx2.fillRect(bx + 1, by + 1, cellW - 2, cellH - 2);
      // Note name
      if (cellH > 16) {
        ctx2.fillStyle = 'rgba(255,255,255,.7)';
        ctx2.font = `bold ${Math.min(cellH * .32, 13)}px sans-serif`;
        ctx2.textAlign = 'center';
        ctx2.textBaseline = 'middle';
        ctx2.fillText(centsToNote(cell.avgPitch), bx + cellW * .5, by + cellH * .5);
      }
      // Dwell bar
      ctx2.fillStyle = `rgba(${rv},${gv},${bv},.95)`;
      ctx2.fillRect(bx + 2, by + cellH - 4, (cellW - 4) * (cell.dwell / (maxDwell || 1)), 3);
      // Vibration dot (yellow = vibrato)
      if (cell.vibration > 10 && cellW > 20) {
        const dotR = Math.min(cellW, cellH) * .09 * Math.min(1, cell.vibration / 60);
        ctx2.beginPath();
        ctx2.arc(bx + cellW * .82, by + cellH * .2, dotR, 0, Math.PI * 2);
        ctx2.fillStyle = 'rgba(255,200,80,.75)';
        ctx2.fill();
      }
    }
  }

  // LMH trace overlay
  const tMin = r.col0 * _cellT, tMax = (r.col1 + 1) * _cellT;
  const pMin = r.row0 * _cellP, pMax = (r.row1 + 1) * _cellP;
  const toX = t => ((t - tMin) / (tMax - tMin)) * W;
  const toY = p => H - ((p - pMin) / (pMax - pMin)) * H;
  ctx2.strokeStyle = 'rgba(255,255,255,.82)';
  ctx2.lineWidth = 1.8;
  ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
  for (const stroke of _strokes) {
    const relevant = stroke.pts.filter(pt => pt.time >= tMin && pt.time <= tMax);
    if (!relevant.length) continue;
    ctx2.beginPath();
    let started = false;
    for (const pt of relevant) {
      const px = toX(pt.time), py = toY(pt.pitch);
      if (!started) { ctx2.moveTo(px, py); started = true; } else ctx2.lineTo(px, py);
    }
    ctx2.stroke();
  }

  // Axis labels
  ctx2.font = '9px sans-serif';
  ctx2.fillStyle = 'rgba(140,100,200,.65)';
  ctx2.textBaseline = 'top';
  for (let c = r.col0; c <= r.col1 + 1; c++) {
    const x = (c - r.col0) * cellW;
    ctx2.textAlign = 'center';
    ctx2.fillText(`${(c * _cellT / 1000).toFixed(2)}s`, Math.max(16, Math.min(W - 16, x)), 2);
  }
  ctx2.textAlign = 'left'; ctx2.textBaseline = 'middle';
  for (let rr = r.row0; rr <= r.row1 + 1; rr++) {
    const y = (r.row1 + 1 - rr) * cellH;
    ctx2.fillText(centsToNote(rr * _cellP), 2, Math.max(6, Math.min(H - 6, y)));
  }

  document.getElementById('zp-footer').textContent =
    `셀: ${_cellT}ms × ${_cellP}¢ (1박 × 1반음)  |  흰 선 = LMH 원본 피치 트레이스`;
}

/* ═══════════════════════════════
   FILE LOADING
═══════════════════════════════ */
function openFile() { document.getElementById('file-input').click(); }

function onFileSelect(e) {
  const file = e.target.files[0]; if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => loadJSON(ev.target.result, file.name);
  reader.readAsText(file);
}

function loadJSON(text, filename) {
  try {
    const data = JSON.parse(text);
    const strokes = extractStrokes(data);
    if (!strokes.length) { toast('허밍 데이터를 찾을 수 없습니다'); return; }
    _strokes = strokes;
    document.getElementById('empty-msg').style.display = 'none';
    if (data.bpm && data.bpm > 0) {
      document.getElementById('bpm-input').value = data.bpm;
    }
    toast(`로드 완료 — ${strokes.length}개 스트로크 (${filename || ''})`);
    fitView();
    rebuildGrid();
  } catch (e) {
    toast('JSON 파싱 오류: ' + e.message);
  }
}

function extractStrokes(data) {
  // SKETCH: {type:'SKETCH', layers:[{type:'lmh', strokes:[{pts}]}]}
  if (data.type === 'SKETCH' && Array.isArray(data.layers)) {
    return data.layers
      .filter(l => l.type === 'lmh' && Array.isArray(l.strokes))
      .flatMap(l => l.strokes)
      .filter(s => s.pts?.length);
  }
  // LMH_STROKE v2: {type:'LMH_STROKE', version:2, strokes:[{points:[{time_ms,pitch_cents}]}]}
  if (data.type === 'LMH_STROKE' && data.version === 2 && Array.isArray(data.strokes)) {
    return data.strokes.map(s => ({
      pts: (s.points || []).map(p => ({ time: p.time_ms, pitch: p.pitch_cents }))
    })).filter(s => s.pts.length);
  }
  // LMH_STROKE v1: {type:'LMH_STROKE', points:[{time_ms,pitch_cents}]}
  if (data.type === 'LMH_STROKE' && Array.isArray(data.points)) {
    return [{ pts: data.points.map(p => ({ time: p.time_ms, pitch: p.pitch_cents })) }];
  }
  // Generic strokes array
  if (Array.isArray(data.strokes)) {
    return data.strokes.map(s => ({
      pts: (s.pts || s.points || []).map(p => ({
        time: p.time ?? p.time_ms ?? 0,
        pitch: p.pitch ?? p.pitch_cents ?? 0
      }))
    })).filter(s => s.pts.length);
  }
  return [];
}

/* ═══════════════════════════════
   VIEW HELPERS
═══════════════════════════════ */
function fitView() {
  if (!_strokes.length) return;
  let tMin = Infinity, tMax = -Infinity, pMin = Infinity, pMax = -Infinity;
  for (const s of _strokes) for (const pt of s.pts) {
    tMin = Math.min(tMin, pt.time); tMax = Math.max(tMax, pt.time);
    pMin = Math.min(pMin, pt.pitch); pMax = Math.max(pMax, pt.pitch);
  }
  const tRange = (tMax - tMin) || 2000;
  const pRange = (pMax - pMin) || 1200;
  const W = mc.width, H = mc.height;
  V.zoom = (W * 0.88) / tRange;
  V.pitchZoom = (H * 0.72) / pRange;
  V.scrollMs = tMin - tRange * 0.06;
  V.pitchCent = (pMin + pMax) / 2;
  draw();
}

function zoomBy(factor) {
  const cMs = xt(mc.width / 2);
  V.zoom = Math.max(.001, Math.min(10, V.zoom * factor));
  V.scrollMs = cMs - (mc.width / 2) / V.zoom;
  draw();
}

/* ═══════════════════════════════
   POINTER / WHEEL
═══════════════════════════════ */
let _isPan = false, _panMs = 0, _panX = 0, _panPitch = 0, _panY = 0;

mc.addEventListener('pointerdown', e => {
  const r = mc.getBoundingClientRect();
  const cx = e.clientX - r.left, cy_px = e.clientY - r.top;

  // Pan: middle-button or alt+left
  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    _isPan = true;
    _panMs = V.scrollMs; _panX = e.clientX;
    _panPitch = V.pitchCent; _panY = e.clientY;
    mc.setPointerCapture(e.pointerId);
    return;
  }
  if (e.button !== 0 || !_cells.size) return;

  const t = xt(cx), p = yc(cy_px);
  const col = Math.floor(t / _cellT), row = Math.floor(p / _cellP);
  const key = `${col},${row}`;

  if (_cells.has(key)) {
    if (e.shiftKey && _anchor) {
      _region = {
        col0: Math.min(_anchor.col, col), row0: Math.min(_anchor.row, row),
        col1: Math.max(_anchor.col, col), row1: Math.max(_anchor.row, row)
      };
      showRegionPanel();
    } else {
      _anchor = { col, row };
      _region = null;
      const c = _cells.get(key);
      _selectedCluster = c.clusterId ?? null;
      showClusterPanel(_selectedCluster);
    }
    draw();
  } else if (!e.shiftKey) {
    clearSelection();
  }
});

mc.addEventListener('pointermove', e => {
  if (!_isPan) return;
  V.scrollMs = _panMs - (e.clientX - _panX) / V.zoom;
  V.pitchCent = _panPitch + (e.clientY - _panY) / V.pitchZoom;
  draw();
});

mc.addEventListener('pointerup', () => { _isPan = false; });
mc.addEventListener('pointercancel', () => { _isPan = false; });

mc.addEventListener('wheel', e => {
  e.preventDefault();
  const r = mc.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  if (e.shiftKey) {
    // Shift+wheel = pitch zoom
    V.pitchZoom = Math.max(.08, Math.min(12, V.pitchZoom * factor));
  } else {
    const cMs = xt(cx);
    V.zoom = Math.max(.001, Math.min(10, V.zoom * factor));
    V.scrollMs = cMs - cx / V.zoom;
  }
  draw();
}, { passive: false });

/* ═══════════════════════════════
   DRAG & DROP
═══════════════════════════════ */
document.addEventListener('dragover', e => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.add('show');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) document.getElementById('drop-overlay').classList.remove('show');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('show');
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.json')) { toast('JSON 파일만 지원합니다'); return; }
  const reader = new FileReader();
  reader.onload = ev => loadJSON(ev.target.result, file.name);
  reader.readAsText(file);
});

/* ═══════════════════════════════
   TOAST
═══════════════════════════════ */
let _toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
resize();
</script>
</body>
</html>
